<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">我的博客</title>
    <style>
        /* ============================================================
           MD3 深色主题设计系统（Material Design 3 + 毛玻璃）
           背景 #0F0F0F / 文字 #E8EAED / 品牌蓝 #1A73E8
           ============================================================ */
        :root {
            --bg: #0F0F0F;
            --surface-glass: rgba(255, 255, 255, 0.045);
            --surface-solid: #1B1B1D;
            --surface-hover: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.09);
            --text-primary: #E8EAED;
            --text-secondary: #9AA0A6;
            --primary: #1A73E8;
            --primary-hover: color-mix(in srgb, var(--primary) 82%, #FFFFFF);
            --primary-container: rgba(26, 115, 232, 0.16);
            --on-primary-container: #D2E3FC;
            --error: #F28B82;
            --error-container: rgba(242, 139, 130, 0.14);
            --success: #81C995;
            --info: #8AB4F8;
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-pill: 999px;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.45);
            --shadow-float: 0 12px 40px rgba(0, 0, 0, 0.55);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px 16px 48px;
            position: relative;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        /* 默认氛围光 + 壁纸压暗层，保证文字高对比 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(600px 320px at 15% -5%, rgba(26, 115, 232, 0.14), transparent 65%),
                radial-gradient(700px 380px at 100% 0%, rgba(138, 180, 248, 0.08), transparent 60%),
                rgba(15, 15, 15, 0.66);
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 880px;
            margin: 0 auto;
            background: var(--surface-glass);
            backdrop-filter: blur(22px) saturate(1.4);
            -webkit-backdrop-filter: blur(22px) saturate(1.4);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }

        /* ---------- 头部 ---------- */
        header {
            padding: 18px 26px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }
        .logo {
            font-size: 21px;
            font-weight: 600;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }
        .logo svg { flex-shrink: 0; }
        .nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
        .nav-links a {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            padding: 9px 18px;
            border-radius: var(--radius-pill);
            border: 1px solid transparent;
            transition: background 0.18s, color 0.18s, border-color 0.18s;
            cursor: pointer;
            user-select: none;
        }
        .nav-links a:hover { background: var(--surface-hover); color: var(--text-primary); }
        .nav-links a.active { background: var(--primary-container); color: var(--on-primary-container); border-color: rgba(26, 115, 232, 0.35); }
        .nav-links a.active svg { color: var(--info); }

        /* ---------- 视图 ---------- */
        .main-content { padding: 26px 28px 32px; }
        .view { display: none; animation: fadeIn 0.28s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .page-heading {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0.2px;
            margin-bottom: 6px;
        }
        .page-heading .dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 14px var(--primary);
            flex-shrink: 0;
        }
        .meta-hint { color: var(--text-secondary); font-size: 13.5px; margin-bottom: 22px; display: flex; align-items: center; gap: 6px; }

        /* ---------- 文章卡片 ---------- */
        .blog-card {
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s, background 0.18s;
            position: relative;
            overflow: hidden;
        }
        .blog-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: var(--primary);
            opacity: 0.9;
        }
        .blog-card:hover {
            transform: translateY(-3px);
            border-color: rgba(26, 115, 232, 0.45);
            background: var(--surface-hover);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
        }
        .blog-card h3 {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            line-height: 1.4;
        }
        .blog-card .author-avatar {
            width: 26px; height: 26px; border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-container);
            flex-shrink: 0;
        }
        .blog-card .cover-img {
            max-width: 100%;
            max-height: 210px;
            width: 100%;
            object-fit: cover;
            border-radius: 14px;
            margin-top: 12px;
            display: block;
            border: 1px solid var(--border);
        }
        .meta {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 10px;
            align-items: center;
        }
        .meta span { display: inline-flex; align-items: center; gap: 5px; }
        .meta svg { color: var(--text-secondary); }
        .summary {
            margin-top: 10px;
            color: #C4C7C5;
            font-size: 14px;
            line-height: 1.6;
            font-weight: 300;
        }
        .post-author {
            font-weight: 500;
            color: var(--info);
            font-size: 13px;
            background: var(--primary-container);
            padding: 3px 12px;
            border-radius: var(--radius-pill);
        }

        /* ---------- 文章详情 ---------- */
        .detail-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--info);
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 18px;
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            border: 1px solid rgba(26, 115, 232, 0.3);
            background: var(--primary-container);
            transition: background 0.18s;
        }
        .detail-back:hover { background: rgba(26, 115, 232, 0.26); }
        .detail-title { font-size: 28px; font-weight: 700; line-height: 1.35; margin-bottom: 10px; }
        .detail-meta {
            font-size: 13.5px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        .detail-meta span { display: inline-flex; align-items: center; gap: 5px; }
        .detail-meta .author-chip {
            color: var(--on-primary-container);
            background: var(--primary-container);
            padding: 3px 12px;
            border-radius: var(--radius-pill);
            font-weight: 500;
        }
        .detail-cover {
            max-width: 100%;
            max-height: 340px;
            width: 100%;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .detail-content {
            font-size: 15.5px;
            line-height: 1.85;
            color: #E3E5E7;
            word-break: break-word;
            margin-bottom: 28px;
        }
        .detail-content p { margin: 0 0 14px; }
        .detail-content img {
            max-width: 100%;
            border-radius: 14px;
            margin: 10px 0;
            border: 1px solid var(--border);
            display: block;
        }
        .detail-content a { color: var(--info); text-decoration: underline; text-underline-offset: 3px; }
        .detail-content h2, .detail-content h3, .detail-content h4 { margin: 20px 0 10px; line-height: 1.4; }
        .detail-content h2 { font-size: 22px; } .detail-content h3 { font-size: 19px; } .detail-content h4 { font-size: 16.5px; }
        .detail-content ul { margin: 0 0 14px; padding-left: 22px; }
        .detail-content li { margin: 4px 0; }
        .detail-content code {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            padding: 2px 7px;
            border-radius: 7px;
            font-size: 13.5px;
            font-family: 'Cascadia Code', Consolas, 'Courier New', monospace;
            color: #FDE293;
        }
        .detail-content strong { color: #FFFFFF; font-weight: 600; }

        /* ---------- 评论 ---------- */
        .comments-section {
            margin-top: 8px;
            border-top: 1px solid var(--border);
            padding-top: 22px;
        }
        .comments-section h4 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }
        .comment-item {
            padding: 14px 2px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }
        .comment-author { font-weight: 600; font-size: 14px; color: var(--info); }
        .comment-time { font-size: 12px; color: var(--text-secondary); margin-left: 10px; }
        .comment-content { margin-top: 6px; font-size: 14.5px; line-height: 1.65; color: #DADCE0; word-break: break-word; }
        .comment-delete {
            position: absolute;
            right: 0; top: 14px;
            color: var(--error);
            cursor: pointer;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            border-radius: var(--radius-pill);
            border: 1px solid rgba(242, 139, 130, 0.3);
            background: var(--error-container);
            transition: background 0.18s;
        }
        .comment-delete:hover { background: rgba(242, 139, 130, 0.24); }
        .comment-input-area { display: flex; gap: 10px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
        .comment-input-area input {
            flex: 1;
            min-width: 160px;
            padding: 12px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            font-size: 14px;
            background: var(--surface-solid);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s;
        }
        .comment-input-area input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-container); }
        .comment-input-area input::placeholder { color: var(--text-secondary); }
        .guest-tip { color: var(--text-secondary); font-size: 13.5px; margin-top: 14px; }
        .guest-tip a { color: var(--info); cursor: pointer; text-decoration: none; font-weight: 500; }

        /* ---------- 按钮 ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border: none;
            border-radius: var(--radius-pill);
            font-size: 14px;
            font-weight: 500;
            padding: 11px 22px;
            cursor: pointer;
            transition: background 0.18s, transform 0.1s, opacity 0.18s;
            font-family: inherit;
            color: #FFFFFF;
            background: var(--primary);
        }
        .btn:hover { background: var(--primary-hover); }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }
        .btn-outline:hover { background: var(--surface-hover); }
        .btn-danger { background: var(--error); color: #200F0E; }
        .btn-danger:hover { background: #FF9A92; }
        .btn-danger-ghost {
            background: var(--error-container);
            color: var(--error);
            border: 1px solid rgba(242, 139, 130, 0.3);
        }
        .btn-danger-ghost:hover { background: rgba(242, 139, 130, 0.22); }
        .btn-info-ghost {
            background: var(--primary-container);
            color: var(--info);
            border: 1px solid rgba(26, 115, 232, 0.35);
        }
        .btn-info-ghost:hover { background: rgba(26, 115, 232, 0.26); }
        .btn-sm { padding: 7px 16px; font-size: 13px; }

        /* ---------- 输入框 ---------- */
        .field {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--surface-solid);
            color: var(--text-primary);
            font-size: 14.5px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s;
        }
        .field:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-container); }
        .field::placeholder { color: var(--text-secondary); }
        textarea.field { min-height: 110px; resize: vertical; line-height: 1.65; }
        label.field-label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0 0 6px 4px;
            font-weight: 500;
        }

        /* ---------- 区块卡片 ---------- */
        .panel {
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px 24px;
            margin-bottom: 18px;
            transition: border-color 0.18s;
        }
        .panel h4 {
            font-size: 16.5px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--text-primary);
        }
        .panel h4 svg { color: var(--info); flex-shrink: 0; }
        .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .row .field { flex: 1; min-width: 150px; }

        /* ---------- 登录 ---------- */
        .login-card {
            max-width: 400px;
            margin: 26px auto;
            background: var(--surface-solid);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 30px 28px;
            box-shadow: var(--shadow-card);
        }
        .login-card h4 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .login-card .sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 20px; }
        .login-card .field { margin-bottom: 14px; }
        .login-btn { width: 100%; }
        .login-error {
            color: var(--error);
            text-align: center;
            display: none;
            margin-top: 12px;
            font-size: 13.5px;
            background: var(--error-container);
            padding: 9px 14px;
            border-radius: var(--radius-md);
        }
        .login-error.show { display: block; }

        /* ---------- 后台列表 ---------- */
        .admin-blog-item, .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 13px 2px;
            border-bottom: 1px solid var(--border);
        }
        .admin-blog-item:last-child, .user-item:last-child { border-bottom: none; }
        .item-title { font-weight: 500; font-size: 14.5px; color: var(--text-primary); }
        .item-sub { color: var(--text-secondary); font-size: 12.5px; margin-left: 8px; }
        .item-actions { display: inline-flex; gap: 8px; }

        /* ---------- 上传控件 ---------- */
        .file-input-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--primary);
            color: #FFFFFF;
            padding: 9px 18px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 500;
            transition: background 0.18s;
        }
        .file-input-label:hover { background: var(--primary-hover); }
        .file-input-label input { display: none; }
        .cover-preview {
            max-width: 100%;
            max-height: 210px;
            border-radius: 14px;
            margin-top: 10px;
            display: none;
            border: 1px solid var(--border);
            object-fit: cover;
        }
        .hint-text { color: var(--text-secondary); font-size: 13px; }
        .avatar-preview {
            width: 62px; height: 62px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            display: none;
            flex-shrink: 0;
        }

        /* ---------- 空状态 ---------- */
        .empty-tip {
            color: var(--text-secondary);
            text-align: center;
            padding: 34px 0;
            font-size: 14.5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .empty-tip svg { opacity: 0.6; }

        /* ---------- Toast ---------- */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 20px;
            border-radius: var(--radius-pill);
            background: #26282B;
            color: var(--text-primary);
            font-size: 14px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-float);
            animation: slideUp 0.3s ease;
            transition: opacity 0.3s;
            max-width: 78vw;
        }
        .toast svg { flex-shrink: 0; }
        .toast.success { border-color: rgba(129, 201, 149, 0.4); }
        .toast.success svg { color: var(--success); }
        .toast.error { border-color: rgba(242, 139, 130, 0.4); }
        .toast.error svg { color: var(--error); }
        .toast.info { border-color: rgba(138, 180, 248, 0.4); }
        .toast.info svg { color: var(--info); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

        /* ---------- 加载圈 ---------- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.5s;
        }
        #loading-screen.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 46px; height: 46px;
            border: 4px solid rgba(255, 255, 255, 0.08);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading-screen p { margin-top: 20px; color: var(--text-secondary); font-size: 14.5px; }
        #loading-error { margin-top: 10px; color: var(--error); font-size: 13.5px; display: none; }
        #retry-btn { margin-top: 14px; display: none; }

        /* ---------- 响应式 ---------- */
        @media (max-width: 640px) {
            body { padding: 12px 10px 32px; }
            .main-content { padding: 18px 16px 24px; }
            header { padding: 14px 18px; flex-direction: column; align-items: stretch; }
            .nav-links { justify-content: center; }
            .comment-input-area { flex-direction: column; }
            .comment-input-area input { width: 100%; min-width: 0; }
            .detail-title { font-size: 23px; }
            .toast-container { left: 16px; right: 16px; bottom: 18px; }
            .toast { max-width: 100%; }
        }
    </style>
</head>
<body>

<!-- ===== 加载圈 ===== -->
<div id="loading-screen">
    <div class="spinner"></div>
    <p>加载中...</p>
    <p id="loading-error"></p>
    <button id="retry-btn" class="btn" onclick="location.reload()">重试</button>
</div>

<div class="container">
    <header>
        <div class="logo">
            <svg width="34" height="34" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <defs>
                    <linearGradient id="logo-grad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#1A73E8"/>
                        <stop offset="1" stop-color="#8AB4F8"/>
                    </linearGradient>
                </defs>
                <rect x="2" y="2" width="36" height="36" rx="12" fill="url(#logo-grad)"/>
                <path d="M11 14 L11 27 L20 18 L29 27 L29 14" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="site-title">MyBlog</span>
        </div>
        <nav class="nav-links">
            <a data-view="home" class="active" id="nav-home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg> 首页</a>
            <a data-view="publish"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8"/><path d="M8 12h8"/></svg> 发布</a>

<div class="toast-container" id="toast-container"></div>

<script>
    // ============================================================
    //  自动检测子路径
    // ============================================================
    const BASE_PATH = window.location.pathname.match(/^\/[^\/]+/)?.[0] || '';
    const API_BASE = BASE_PATH + '/api';

    // ============================================================
    //  内联 SVG 图标（替代 Font Awesome CDN，自托管零外部依赖）
    // ============================================================
    const ICON_PATHS = {
        home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>',
        calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
        eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
        comment: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
        trash: '<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6"/><path d="M14 11v6"/>',
        user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
        image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
        key: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
        send: '<path d="m22 2-11 11"/><path d="M22 2 15 22l-4-9-9-4z"/>',
        logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>',
        check: '<path d="M20 6 9 17l-5-5"/>',
        alert: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
        x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
        edit: '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
        shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
        list: '<path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/>',
        users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
        tag: '<path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1"/>',
        arrowLeft: '<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>',
        star: '<path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>'
    };
    function ic(name, size) {
        size = size || 16;
        return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name] || ''}</svg>`;
    }

    // ============================================================
    //  全局状态
    // ============================================================
    let currentUser = null;
    let posts = [];
    let currentView = 'home';
    let blogTitle = '我的博客';
    let themeColor = '#1A73E8';
    let appLoaded = false;

    // ============================================================
    //  加载圈控制
    // ============================================================
    function showLoading() {
        document.getElementById('loading-screen').classList.remove('hidden');
    }

    function hideLoading() {
        document.getElementById('loading-screen').classList.add('hidden');
        appLoaded = true;
    }

    function showLoadingError(msg) {
        document.getElementById('loading-error').textContent = msg || '加载失败，请刷新重试';
        document.getElementById('loading-error').style.display = 'block';
        document.getElementById('retry-btn').style.display = 'block';
    }

    // ============================================================
    //  工具函数
    // ============================================================
    function showToast(msg, type) {
        type = type || 'info';
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.innerHTML = ic(type === 'success' ? 'check' : type === 'error' ? 'alert' : 'comment', 15) + `<span>${escapeHtml(msg)}</span>`;
        container.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
    }

    async function apiFetch(endpoint, options) {
        options = options || {};
        const res = await fetch(API_BASE + endpoint, {
            ...options,
            headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '请求失败');
        return data;
    }

    function formatDate(ts) {
        const d = new Date(ts);
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
    }

    // 本地资源（/uploads/...）自动补全部署子路径
    function resolveAsset(url) {
        if (!url) return '';
        if (url.startsWith('/')) return BASE_PATH + url;
        return url;
    }

    function safeUrl(url) {
        const s = String(url || '').trim();
        if (!s || s.startsWith('data:') || s.startsWith('javascript:')) return '';
        if (/^(https?:)?\/\//.test(s) || s.startsWith('/')) return escapeHtml(s);
        return '';
    }

    // 安全迷你 Markdown 渲染：图片 / 链接 / 粗体 / 行内代码 / 标题 / 列表 / 段落
    function renderContent(text) {
        if (!text) return '';
        let html = escapeHtml(text);
        html = html.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, url) => {
            const src = safeUrl(url);
            return src ? `<img src="${src}" alt="${escapeHtml(alt)}" loading="lazy" />` : '';
        });
        html = html.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, url) => {
            const href = safeUrl(url);
            return href ? `<a href="${href}" target="_blank" rel="noopener noreferrer">${t}</a>` : escapeHtml(t);
        });
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        html = html.replace(/^### (.*)$/gm, '<h4>$1</h4>');
        html = html.replace(/^## (.*)$/gm, '<h3>$1</h3>');
        html = html.replace(/^# (.*)$/gm, '<h2>$1</h2>');
        html = html.replace(/(?:^|\n)((?:- .*(?:\n|$))+)/g, (m, block) => {
            const items = block.trim().split('\n').map(l => l.replace(/^-\s+/, '').trim()).filter(Boolean);
            return '\n\n<ul>' + items.map(i => '<li>' + i + '</li>').join('') + '</ul>\n\n';
        });
        html = html.split(/\n{2,}/).map(p => {
            const t = p.trim();
            if (!t) return '';
            if (/^<(h2|h3|h4|ul|img|blockquote)/.test(t)) return t;
            return '<p>' + t.replace(/\n/g, '<br/>') + '</p>';
        }).join('');
        return html;
    }

    function applyThemeColor(color) {
        themeColor = color;
        document.documentElement.style.setProperty('--primary', color);
    }

    // ============================================================
    //  草稿管理
    // ============================================================
    function loadDraft() {
        try {
            const draft = localStorage.getItem('blog_draft');
            if (draft) {
                const data = JSON.parse(draft);
                const titleInput = document.getElementById('pub-title');
                const contentInput = document.getElementById('pub-content');
                const coverInput = document.getElementById('pub-cover-url');
                if (titleInput) titleInput.value = data.title || '';
                if (contentInput) contentInput.value = data.content || '';
                if (coverInput) coverInput.value = data.cover || '';
                if (data.cover) {
                    const preview = document.getElementById('cover-preview');
                    if (preview) {
                        preview.src = resolveAsset(data.cover);
                        preview.style.display = 'block';
                    }
                }
                if (data.title || data.content) {
                    showToast('已恢复未发布的草稿', 'info');
                }
            }
        } catch (e) {}
    }

    let draftTimer = null;
    function saveDraft() {
        clearTimeout(draftTimer);
        draftTimer = setTimeout(() => {
            try {
                const title = document.getElementById('pub-title')?.value?.trim() || '';
                const content = document.getElementById('pub-content')?.value?.trim() || '';
                const cover = document.getElementById('pub-cover-url')?.value?.trim() || '';
                if (title || content || cover) {
                    localStorage.setItem('blog_draft', JSON.stringify({ title, content, cover }));
                } else {
                    localStorage.removeItem('blog_draft');
                }
            } catch (e) {}
        }, 3000);
    }

    function clearDraft() {
        localStorage.removeItem('blog_draft');
    }

    // ============================================================
    //  文章列表
    // ============================================================
    async function loadPosts() {
        try {
            const data = await apiFetch('/posts');
            posts = data.posts || [];
            renderPostList();
        } catch (err) {
            showToast('加载文章失败: ' + err.message, 'error');
            document.getElementById('blog-list').innerHTML = '<div class="empty-tip">加载失败</div>';
        }
    }

    function renderPostList() {
        const list = document.getElementById('blog-list');
        const count = document.getElementById('post-count');
        if (!posts.length) {
            list.innerHTML = `<div class="empty-tip">${ic('comment', 30)}暂无文章</div>`;
            count.textContent = '共 0 篇';
            return;
        }
        count.textContent = `共 ${posts.length} 篇`;
        const sorted = [...posts].sort((a, b) => b.createdAt - a.createdAt);
        list.innerHTML = sorted.map(p => `
            <div class="blog-card" onclick="viewPost('${p.id}')">
                <h3>
                    ${p.authorAvatar ? `<img class="author-avatar" src="${escapeHtml(resolveAsset(p.authorAvatar))}" alt="头像" />` : ''}
                    ${escapeHtml(p.title)}
                    <span class="post-author">by ${escapeHtml(p.authorDisplay || p.author || '未知')}</span>
                </h3>
                ${p.cover ? `<img class="cover-img" src="${escapeHtml(resolveAsset(p.cover))}" alt="封面" loading="lazy" />` : ''}
                <div class="meta">
                    <span>${ic('calendar', 13)} ${formatDate(p.createdAt)}</span>
                    <span>${ic('eye', 14)} ${p.views || 0}</span>
                </div>
                <div class="summary">${escapeHtml((p.content || '').replace(/[#*_>\`]/g, '').slice(0, 120))}${p.content && p.content.length > 120 ? '…' : ''}</div>
            </div>
        `).join('');
    }

    // ============================================================
    //  文章详情
    // ============================================================
    async function viewPost(id) {
        try {
            switchView('detail');
            document.getElementById('detail-content').innerHTML =
                '<div style="text-align:center;padding:50px 0;"><div class="spinner" style="margin:0 auto;"></div><p style="margin-top:16px;color:var(--text-secondary);">加载中...</p></div>';
            const data = await apiFetch(`/posts/${id}`);
            const post = data.post;
            if (!post) throw new Error('文章不存在');
            document.getElementById('detail-content').innerHTML = `
                <h1 class="detail-title">${escapeHtml(post.title)}</h1>
                <div class="detail-meta">
                    <span>${ic('calendar', 13)} ${formatDate(post.createdAt)}</span>
                    <span>${ic('eye', 14)} ${post.views || 0}</span>
                    ${post.authorAvatar ? `<img src="${escapeHtml(resolveAsset(post.authorAvatar))}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid var(--primary-container);" alt="头像" />` : ''}
                    <span class="author-chip">${escapeHtml(post.authorDisplay || post.author || '未知')}</span>
                </div>
                ${post.cover ? `<img class="detail-cover" src="${escapeHtml(resolveAsset(post.cover))}" alt="封面" />` : ''}
                <div class="detail-content">${renderContent(post.content)}</div>
            `;
            renderComments(post);
            window._currentPostId = id;
        } catch (err) {
            const dc = document.getElementById('detail-content');
            if (dc) dc.innerHTML = `<div class="empty-tip" style="color:var(--error);">加载失败：${escapeHtml(err.message)}</div>`;
            showToast('加载文章失败: ' + err.message, 'error');
        }
    }

    // ============================================================
    //  评论
    // ============================================================
    function renderComments(post) {
        const container = document.getElementById('comments-area');
        let html = `<div class="comments-section"><h4>${ic('comment', 17)} 评论 (${post.comments ? post.comments.length : 0})</h4>`;
        if (post.comments && post.comments.length > 0) {
            const sorted = [...post.comments].sort((a, b) => a.createdAt - b.createdAt);
            sorted.forEach(c => {
                html += `
                    <div class="comment-item">
                        <span class="comment-author">${escapeHtml(c.authorDisplay || c.author)}</span>
                        <span class="comment-time">${formatDate(c.createdAt)}</span>
                        ${(currentUser && (currentUser.username === c.author || currentUser.role === 'super_admin')) ? `<span class="comment-delete" onclick="deleteComment('${c.id}')">${ic('x', 12)}</span>` : ''}
                        <div class="comment-content">${escapeHtml(c.content)}</div>
                    </div>
                `;
            });
        } else {
            html += `<p class="hint-text" style="padding:6px 0;">暂无评论，来说点什么吧</p>`;
        }
        if (currentUser) {
            html += `
                <div class="comment-input-area">
                    <input type="text" id="comment-input" placeholder="写下你的评论..." maxlength="500" />
                    <button class="btn" onclick="submitComment()">发表</button>
                </div>
            `;
        } else {
            html += `<p class="guest-tip"><a onclick="switchView('admin');return false;">登录</a> 后发表评论</p>`;
        }
        html += `</div>`;
        container.innerHTML = html;
    }

    async function submitComment() {
        if (!currentUser) { showToast('请先登录', 'error'); return; }
        const input = document.getElementById('comment-input');
        if (!input) return;
        const content = input.value.trim();
        if (!content) { showToast('评论不能为空', 'error'); return; }
        const postId = window._currentPostId;
        try {
            await apiFetch(`/posts/${postId}/comments`, {
                method: 'POST',
                body: JSON.stringify({ content })
            });
            showToast('评论发表成功', 'success');
            viewPost(postId);
        } catch (err) {
            showToast('评论失败: ' + err.message, 'error');
        }
    }

    async function deleteComment(commentId) {
        if (!confirm('确定要删除这条评论吗？')) return;
        const postId = window._currentPostId;
        try {
            await apiFetch(`/posts/${postId}/comments/${commentId}`, { method: 'DELETE' });
            showToast('评论已删除', 'success');
            viewPost(postId);
        } catch (err) {
            showToast('删除失败: ' + err.message, 'error');
        }
    }

    function goHome() { switchView('home'); }

    // ============================================================
    //  视图切换
    // ============================================================
    function switchView(view) {
        currentView = view;
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        if (view === 'home') {
            document.getElementById('view-home').classList.add('active');
            if (window._bootstrapPostsReady) {
                window._bootstrapPostsReady = false;
                renderPostList();
            } else {
                loadPosts();
            }
        } else if (view === 'detail') {
            document.getElementById('view-detail').classList.add('active');
        } else if (view === 'publish') {
            document.getElementById('view-publish').classList.add('active');
            if (!currentUser) {
                showToast('请先登录', 'error');
                switchView('admin');
            }
        } else if (view === 'admin') {
            document.getElementById('view-admin').classList.add('active');
            loadAdminPanel();
        }
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.toggle('active', a.dataset.view === view));
        window.scrollTo(0, 0);
    }

    document.querySelectorAll('.nav-links a').forEach(a => {
        a.addEventListener('click', (e) => {
            e.preventDefault();
            const view = a.dataset.view;
            if (view === 'admin' && !currentUser) {
                switchView('admin');
            } else {
                switchView(view);
            }
        });
    });

    // ============================================================
    //  封面和图片上传
    // ============================================================
    document.getElementById('cover-upload').addEventListener('change', async function(e) {
        const file = this.files[0];

        const formData = new FormData();
        formData.append('image', file);

            const res = await fetch(API_BASE + '/upload', { method: 'POST', body: formData });

            if (data.success) {
                document.getElementById('pub-cover-url').value = data.url;
                const preview = document.getElementById('cover-preview');

                showToast('封面上传失败: ' + (data.error || '未知错误'), 'error');
            }
        } catch (err) {
            showToast('封面上传失败: ' + err.message, 'error');
        }
    });

    document.getElementById('pub-cover-url').addEventListener('input', function() {
        const url = this.value.trim();
        const preview = document.getElementById('cover-preview');
        if (url) {

            preview.style.display = 'block';

    function insertImage() {
        if (!currentUser) { showToast('请先登录', 'error'); return; }
        document.getElementById('image-upload').click();
    }

    document.getElementById('image-upload').addEventListener('change', async function(e) {
        const file = this.files[0];
        if (!file) return;
        const formData = new FormData();
        formData.append('image', file);
        try {
            const res = await fetch(API_BASE + '/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                const textarea = document.getElementById('pub-content');
                const markdown = `![${file.name}](${resolveAsset(data.url)})`;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                textarea.value = textarea.value.substring(0, start) + markdown + textarea.value.substring(end);
                textarea.focus();
                textarea.selectionStart = textarea.selectionEnd = start + markdown.length;
                showToast('图片已插入', 'success');
            } else {
                showToast('图片上传失败: ' + (data.error || '未知错误'), 'error');
            }
        } catch (err) {
            showToast('图片上传失败: ' + err.message, 'error');
        }
        this.value = '';
    });

    async function handleUpdateAvatar() {
        if (!currentUser) { showToast('请先登录', 'error'); return; }
        const avatar = document.getElementById('avatar-url').value.trim();
        if (!avatar) { showToast('请先上传或输入图片URL', 'error'); return; }
        try {
            await apiFetch(`/users/${currentUser.username}/avatar`, {
                method: 'PUT',

            });
            showToast('头像更新成功', 'success');

            if (currentView === 'detail' && window._currentPostId) viewPost(window._currentPostId);

    // ============================================================
    //  发布文章（含链接复制）
    // ============================================================
    async function handlePublish() {
        if (!currentUser) { showToast('请先登录', 'error'); return; }
        const title = document.getElementById('pub-title').value.trim();
        const content = document.getElementById('pub-content').value.trim();
        const cover = document.getElementById('pub-cover-url').value.trim();
        if (!title || !content) {
            showToast('标题和内容不能为空', 'error');
            return;
        }
        try {
            const data = await apiFetch('/posts', {
                method: 'POST',
                body: JSON.stringify({ title, content, cover })
            });

            if (data.url) {
                showToast('发布成功！链接已生成', 'success');
                setTimeout(() => {
                    if (confirm(`文章已发布！\n访问链接：${data.url}\n点击"确定"复制链接到剪贴板`)) {
                        navigator.clipboard?.writeText(data.url);
                    }
                }, 500);
            } else {
                showToast('发布成功！', 'success');
            }

            document.getElementById('pub-title').value = '';
            document.getElementById('pub-content').value = '';
            document.getElementById('pub-cover-url').value = '';
            document.getElementById('cover-preview').style.display = 'none';
            clearDraft();
            if (currentView === 'home') loadPosts();
            switchView('home');
        } catch (err) {
            showToast('发布失败: ' + err.message, 'error');
        }
    }

    // ============================================================
    //  管理后台
    // ============================================================
    async function loadAdminPanel() {
        try {
            const data = await apiFetch('/auth/status');
            if (data.isAdmin && data.user) {
                currentUser = data.user;
                document.getElementById('admin-login-box').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('admin-status').innerHTML = `${ic('check', 13)} 已登录 (${escapeHtml(currentUser.displayName || currentUser.username)})`;
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                if (currentUser.role === 'super_admin') {
                    document.querySelectorAll('.super-only').forEach(el => el.style.display = 'block');
                    try {
                        const cfg = await apiFetch('/config');
                        if (cfg.blogTitle) {
                            document.getElementById('blog-title-input').value = cfg.blogTitle;
                        }
                    } catch (e) {}
                } else {
                    document.querySelectorAll('.super-only').forEach(el => el.style.display = 'none');
                }
                document.getElementById('display-name-input').value = currentUser.displayName || currentUser.username;
                if (currentUser.avatar) {
                    document.getElementById('avatar-preview').src = resolveAsset(currentUser.avatar);
                    document.getElementById('avatar-preview').style.display = 'block';
                    document.getElementById('avatar-url').value = currentUser.avatar;
                }
                await loadAdminPosts();
                if (currentUser.role === 'super_admin') loadUserList();
            } else {
                currentUser = null;
                document.getElementById('admin-login-box').style.display = 'block';
                document.getElementById('admin-panel').style.display = 'none';
                document.getElementById('admin-status').innerHTML = `${ic('key', 13)} 请登录`;
                document.getElementById('login-error').classList.remove('show');
            }
        } catch (err) {
            currentUser = null;
            document.getElementById('admin-login-box').style.display = 'block';
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('admin-status').innerHTML = `${ic('key', 13)} 请登录`;
        }
    }

    async function loadAdminPosts() {
        try {
            const data = await apiFetch('/posts');
            posts = data.posts || [];
            renderAdminPostList();
        } catch (err) {
            showToast('加载文章失败', 'error');
        }
    }

    function renderAdminPostList() {
        const container = document.getElementById('admin-post-list');
        if (!posts.length) {
            container.innerHTML = '<div class="empty-tip">暂无文章</div>';
            return;
        }
        const sorted = [...posts].sort((a, b) => b.createdAt - a.createdAt);
        container.innerHTML = sorted.map(p => `
            <div class="admin-blog-item">
                <div><span class="item-title">${escapeHtml(p.title)}</span> <span class="item-sub">${formatDate(p.createdAt)} · by ${escapeHtml(p.authorDisplay || p.author || '未知')}</span></div>
                <div class="item-actions">
                    <button class="btn btn-danger-ghost btn-sm" onclick="handleDelete('${p.id}')">${ic('trash', 13)} 删除</button>
                </div>
            </div>
        `).join('');
    }

    // ============================================================
    //  用户管理
    // ============================================================
    async function loadUserList() {
        if (!currentUser || currentUser.role !== 'super_admin') return;
        try {
            const data = await apiFetch('/users');
            const users = data.users || [];
            const container = document.getElementById('user-list');
            if (!users.length) {
                container.innerHTML = '<div class="empty-tip">暂无其他管理员</div>';
                return;
            }
            container.innerHTML = users.map(u => `
                <div class="user-item">
                    <div><span class="item-title">${escapeHtml(u.username)}</span> <span class="item-sub">${escapeHtml(u.displayName || u.username)}</span>${u.role === 'super_admin' ? `<span class="item-sub">${ic('star', 12)} 超管</span>` : ''}</div>
                    <div class="item-actions">
                        ${u.role !== 'super_admin' ? `<button class="btn btn-danger-ghost btn-sm" onclick="handleDeleteUser('${u.username}')">${ic('trash', 13)} 删除</button>` : ''}
                        ${u.username === currentUser.username ? '' : `<button class="btn btn-info-ghost btn-sm" onclick="handleResetPassword('${u.username}')">${ic('key', 13)} 重置密码</button>`}
                    </div>
                </div>
            `).join('');
        } catch (err) {
            showToast('加载用户列表失败', 'error');
        }
    }

    async function handleCreateUser() {
        const username = document.getElementById('new-username').value.trim();
        const password = document.getElementById('new-password').value.trim();
        if (!username || !password) {
            showToast('请填写用户名和密码', 'error');
            return;

        try {
            await apiFetch('/users', {
                method: 'POST',
                body: JSON.stringify({ username, password })
            });
            showToast('管理员创建成功', 'success');
            document.getElementById('new-username').value = '';
            document.getElementById('new-password').value = '';
            loadUserList();
        } catch (err) {
            showToast('创建失败: ' + err.message, 'error');
        }
    }

    async function handleDeleteUser(username) {
        if (!confirm(`确认删除管理员 ${username}？其所有文章也将被删除。`)) return;
        try {
            await apiFetch(`/users/${username}`, { method: 'DELETE' });
            showToast('管理员已删除', 'success');
            loadUserList();
            loadAdminPosts();

            showToast('删除失败: ' + err.message, 'error');
        }

    // ============================================================
    //  密码
    // ============================================================
    async function handleChangePassword() {
        if (!currentUser) { showToast('请先登录', 'error'); return; }
        const oldPwd = document.getElementById('old-pwd').value.trim();
        const newPwd = document.getElementById('new-pwd').value.trim();
        if (!newPwd) { showToast('新密码不能为空', 'error'); return; }
        if (newPwd.length < 3) { showToast('新密码长度至少3位', 'error'); return; }
        try {
            await apiFetch(`/users/${currentUser.username}/password`, {
                method: 'PUT',
                body: JSON.stringify({ oldPassword: oldPwd, newPassword: newPwd })
            });
            showToast('密码修改成功，请重新登录', 'success');
            document.getElementById('old-pwd').value = '';
            document.getElementById('new-pwd').value = '';
            await handleLogout();
        } catch (err) {
            showToast('修改失败: ' + err.message, 'error');
        }
    }

    async function handleResetPassword(username) {
        if (!confirm(`确认重置用户 ${username} 的密码为 "123456"？`)) return;
        try {
            await apiFetch(`/users/${username}/password`, {
                method: 'PUT',
                body: JSON.stringify({ oldPassword: '', newPassword: '123456' })

    //  清空文章

        if (!currentUser || currentUser.role !== 'super_admin') {
            showToast('权限不足', 'error');
            return;

        if (!confirm('确定要删除所有文章吗？此操作不可恢复！')) return;

    // ============================================================
    //  登录/登出
    // ============================================================
    async function handleLogin() {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value.trim();
        try {
            const data = await apiFetch('/auth/login', {
                method: 'POST',
                body: JSON.stringify({ username, password })
            });
            if (data.success && data.user) {
                currentUser = data.user;
                showToast('登录成功', 'success');
                loadAdminPanel();
                await loadConfig();
                if (currentView === 'detail' && window._currentPostId) {
                    viewPost(window._currentPostId);
                }
            } else {
                document.getElementById('login-error').textContent = '用户名或密码错误';
                document.getElementById('login-error').classList.add('show');
            }
        } catch (err) {
            showToast('登录失败: ' + err.message, 'error');
        }
    }

    async function handleLogout() {
        try {
            await apiFetch('/auth/logout', { method: 'POST' });
            currentUser = null;
            showToast('已退出', 'info');
            loadAdminPanel();
            if (currentView === 'admin') switchView('admin');
            if (currentView === 'detail' && window._currentPostId) {
                viewPost(window._currentPostId);
            }
        } catch (err) {
            showToast('退出失败', 'error');
        }
    }

    // ============================================================
    //  快捷发布（管理后台）
    // ============================================================
    async function handleAddPost(e) {
        e.preventDefault();
        if (!currentUser) { showToast('请先登录', 'error'); return; }
        const title = document.getElementById('add-title').value.trim();
        const content = document.getElementById('add-content').value.trim();
        const cover = document.getElementById('add-cover').value.trim();
        if (!title || !content) { showToast('标题和内容不能为空', 'error'); return; }
        try {
            await apiFetch('/posts', {
                method: 'POST',
                body: JSON.stringify({ title, content, cover })
            });
            showToast('发布成功', 'success');
            document.getElementById('add-title').value = '';
            document.getElementById('add-content').value = '';
            document.getElementById('add-cover').value = '';
            await loadAdminPosts();
            if (currentView === 'home') loadPosts();
        } catch (err) {
            showToast('发布失败: ' + err.message, 'error');
        }
    }

    async function handleDelete(id) {
        if (!confirm('确认删除该文章？')) return;
        try {
            await apiFetch(`/posts/${id}`, { method: 'DELETE' });
            showToast('已删除', 'success');
            await loadAdminPosts();
            if (currentView === 'home') loadPosts();
            if (currentView === 'detail') goHome();
        } catch (err) {
            showToast('删除失败: ' + err.message, 'error');
        }
    }

    // 回车登录
    document.getElementById('login-password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('login-username').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleLogin();
    });

    // ============================================================
    //  配置加载（登录后刷新主题色/壁纸）
    // ============================================================
    async function loadConfig() {
        try {
            const data = await apiFetch('/config');
            if (data && data.blogTitle) {
                blogTitle = data.blogTitle;
                document.title = blogTitle;
                document.getElementById('site-title').textContent = blogTitle;
                document.getElementById('home-title').textContent = blogTitle;
            }
            if (data && data.themeColor) {
                applyThemeColor(data.themeColor);
            }
            if (data && data.wallpaper) {
                document.body.style.backgroundImage = `url(${resolveAsset(data.wallpaper)})`;
            }
        } catch (err) {
            console.warn('无法加载配置');
        }
    }

    // ============================================================
    //  初始化
    // ============================================================
    window.onload = async function() {
        showLoading();
        const slowTimer = setTimeout(() => {
            const p = document.querySelector('#loading-screen p');
            if (p && !appLoaded) p.textContent = '正在连接服务器，若长时间无响应可能是服务正在启动，请稍候或刷新重试…';
        }, 8000);
        try {
            const data = await apiFetch('/bootstrap');

            if (data.config) {
                if (data.config.blogTitle) {
                    blogTitle = data.config.blogTitle;
                    document.title = blogTitle;
                    document.getElementById('site-title').textContent = blogTitle;
                    document.getElementById('home-title').textContent = blogTitle;
                }
                if (data.config.themeColor) {
                    applyThemeColor(data.config.themeColor);
                }
                if (data.config.wallpaper) {
                    document.body.style.backgroundImage = `url(${resolveAsset(data.config.wallpaper)})`;
                }
            }

            loadDraft();

            posts = data.posts || [];
            window._bootstrapPostsReady = true;
            renderPostList();

            if (data.auth && data.auth.isAdmin && data.auth.user) {
                currentUser = data.auth.user;
            }

            const path = window.location.pathname;
            const match = path.match(/\/p\/([a-f0-9]+)/);
            if (match) {
                const postId = match[1];
                switchView('detail');
                await viewPost(postId);
                if (window.history && window.history.pushState) {
                    const cleanUrl = window.location.origin + window.location.pathname.replace(/\/p\/[a-f0-9]+/, '');
                    window.history.pushState({}, '', cleanUrl);
                }
                hideLoading();
                return;
            }

            switchView('home');
            hideLoading();
        } catch (err) {
            clearTimeout(slowTimer);
            console.error('初始化失败:', err);
            showLoadingError(err.message || '加载失败，请刷新重试');
            return;
        }
        clearTimeout(slowTimer);
    };

    // ============================================================
    //  暴露全局
    // ============================================================
    window.viewPost = viewPost;
    window.goHome = goHome;
    window.handleLogin = handleLogin;
    window.handleLogout = handleLogout;
    window.handleAddPost = handleAddPost;
    window.handleDelete = handleDelete;
    window.handleCreateUser = handleCreateUser;
    window.handleDeleteUser = handleDeleteUser;
    window.handleChangePassword = handleChangePassword;
    window.handleResetPassword = handleResetPassword;
    window.handleUpdateTitle = handleUpdateTitle;
    window.handleClearAllPosts = handleClearAllPosts;
    window.handleUpdateDisplayName = handleUpdateDisplayName;
    window.handleUpdateAvatar = handleUpdateAvatar;
    window.submitComment = submitComment;
    window.deleteComment = deleteComment;
    window.switchView = switchView;
    window.handlePublish = handlePublish;
    window.insertImage = insertImage;
    window.saveDraft = saveDraft;
</script>
</body>
</html>
