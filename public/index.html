<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">我的博客</title>
    <!-- Google Pixel UI 风格：Roboto 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== Pixel UI (Material You 风格) ===== */
        :root { --theme-color: #4CAF50; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto', sans-serif;
            background: #f5f5f5;
            color: #1c1c1c;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        body.dark { background: #1c1c1c; color: #e0e0e0; }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            overflow: hidden;
            transition: background 0.3s;
        }
        body.dark .container { background: rgba(30,30,30,0.9); }

        header {
            padding: 20px 28px;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        body.dark header { border-bottom-color: rgba(255,255,255,0.08); }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo i { color: var(--theme-color); font-size: 28px; }

        .nav-links a {
            color: #444;
            margin-left: 16px;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            padding: 6px 12px;
            border-radius: 20px;
            transition: background 0.2s;
            cursor: pointer;
        }
        body.dark .nav-links a { color: #ccc; }
        .nav-links a:hover { background: rgba(0,0,0,0.05); }
        body.dark .nav-links a:hover { background: rgba(255,255,255,0.08); }
        .nav-links .admin-btn, .nav-links .publish-btn {
            background: var(--theme-color);
            color: #fff !important;
            padding: 6px 18px;
            border-radius: 24px;
        }
        body.dark .nav-links .admin-btn, body.dark .nav-links .publish-btn { color: #1c1c1c !important; }

        .main-content { padding: 28px 32px; }

        .view { display: none; animation: fadeIn 0.25s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* 卡片样式 */
        .blog-card {
            background: #fff;
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.2s;
            border-left: 6px solid var(--theme-color);
        }
        body.dark .blog-card { background: #2a2a2a; border-left-color: var(--theme-color); }
        .blog-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.08); transform: translateY(-2px); }
        .blog-card h3 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
        .blog-card .cover-img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 10px; }
        .meta { font-size: 13px; color: #888; display: flex; gap: 16px; flex-wrap: wrap; }
        .summary { margin-top: 10px; color: #555; font-weight: 300; line-height: 1.5; }
        body.dark .summary { color: #aaa; }

        .detail-back { color: var(--theme-color); cursor: pointer; font-weight: 500; display: inline-block; margin-bottom: 16px; }
        .detail-title { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
        .detail-meta { font-size: 14px; color: #888; margin-bottom: 16px; }
        .detail-content { font-size: 16px; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; margin-bottom: 24px; }
        .detail-content img { max-width: 100%; border-radius: 12px; margin: 10px 0; }

        /* 评论 */
        .comments-section { margin-top: 32px; border-top: 1px solid #ddd; padding-top: 20px; }
        body.dark .comments-section { border-top-color: #444; }
        .comments-section h4 { font-size: 18px; font-weight: 500; margin-bottom: 16px; }
        .comment-item { padding: 12px 0; border-bottom: 1px solid #eee; }
        body.dark .comment-item { border-bottom-color: #333; }
        .comment-author { font-weight: 500; font-size: 14px; }
        .comment-time { font-size: 12px; color: #999; margin-left: 12px; }
        .comment-content { margin-top: 4px; font-size: 15px; }
        .comment-delete { float: right; color: #e17055; cursor: pointer; font-size: 13px; }
        .comment-input-area { display: flex; gap: 10px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
        .comment-input-area input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 24px; font-size: 14px; background: #fff; outline: none; min-width: 150px; }
        body.dark .comment-input-area input { background: #2a2a2a; border-color: #555; color: #e0e0e0; }
        .comment-input-area button { background: var(--theme-color); color: #fff; border: none; padding: 8px 20px; border-radius: 24px; font-weight: 500; cursor: pointer; }

        /* 登录表单 */
        .login-form { max-width: 380px; margin: 30px auto; background: #fff; padding: 28px 24px; border-radius: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        body.dark .login-form { background: #2a2a2a; }
        .login-form input { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 24px; margin-bottom: 14px; font-size: 15px; background: #f9f9f9; outline: none; }
        body.dark .login-form input { background: #1c1c1c; border-color: #444; color: #e0e0e0; }
        .login-btn { width: 100%; padding: 12px; background: var(--theme-color); color: #fff; border: none; border-radius: 24px; font-weight: 500; font-size: 16px; cursor: pointer; }
        .login-error { color: #e17055; text-align: center; display: none; margin-top: 8px; }

        /* 管理面板 */
        .admin-section { background: #fff; border-radius: 20px; padding: 20px 24px; margin-bottom: 20px; }
        body.dark .admin-section { background: #2a2a2a; }
        .admin-section h4 { font-size: 18px; font-weight: 500; margin-bottom: 12px; }
        .admin-section input, .admin-section textarea { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 16px; margin-bottom: 10px; font-size: 14px; background: #f9f9f9; font-family: inherit; outline: none; }
        body.dark .admin-section input, body.dark .admin-section textarea { background: #1c1c1c; border-color: #444; color: #e0e0e0; }
        .admin-section textarea { min-height: 100px; resize: vertical; }
        .submit-btn { background: var(--theme-color); color: #fff; border: none; padding: 8px 24px; border-radius: 24px; font-weight: 500; cursor: pointer; }

        .admin-blog-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; align-items: center; flex-wrap: wrap; }
        body.dark .admin-blog-item { border-bottom-color: #333; }
        .del-btn { background: #e17055; color: #fff; border: none; padding: 4px 14px; border-radius: 16px; cursor: pointer; }
        .danger-btn { background: #e17055; color: #fff; border: none; padding: 8px 20px; border-radius: 24px; font-weight: 500; cursor: pointer; }

        .empty-tip { color: #999; text-align: center; padding: 30px 0; }

        /* 发布页面 */
        .publish-form .form-group { margin-bottom: 16px; }
        .publish-form label { display: block; font-weight: 500; margin-bottom: 4px; }
        .publish-form input, .publish-form textarea { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 16px; font-size: 14px; background: #f9f9f9; font-family: inherit; outline: none; }
        body.dark .publish-form input, body.dark .publish-form textarea { background: #1c1c1c; border-color: #444; color: #e0e0e0; }
        .publish-form textarea { min-height: 200px; resize: vertical; }
        .publish-form .file-upload-wrapper { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .publish-form .file-upload-wrapper input[type="file"] { flex: 1; }
        .publish-form .preview-img { max-width: 100%; max-height: 200px; border-radius: 12px; margin-top: 8px; }
        .publish-form .insert-image-btn { background: var(--theme-color); color: #fff; border: none; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-weight: 500; }

        /* Toast */
        .toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 12px 20px; border-radius: 24px; background: #333; color: #fff; font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); animation: slideUp 0.3s ease; }
        .toast.success { background: #00b894; }
        .toast.error { background: #e17055; }
        .toast.info { background: #0984e3; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .post-author { font-weight: 500; color: var(--theme-color); }

        .color-picker-wrapper { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        @media (max-width: 640px) {
            .main-content { padding: 16px; }
            header { flex-direction: column; align-items: stretch; gap: 10px; }
            .nav-links { display: flex; justify-content: center; flex-wrap: wrap; }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="logo"><i class="fas fa-feather-alt"></i> <span id="site-title">MyBlog</span></div>
        <div class="nav-links">
            <a data-view="home"><i class="fas fa-home"></i> 首页</a>
            <a data-view="publish" class="publish-btn"><i class="fas fa-plus-circle"></i> 发布</a>
            <a data-view="admin" class="admin-btn"><i class="fas fa-user-cog"></i> 管理</a>
        </div>
    </header>
    <div class="main-content">
        <!-- 首页 -->
        <div id="view-home" class="view active">
            <h1 id="home-title" style="font-weight:300; font-size:28px;">所有文章</h1>
            <p id="post-count" style="color:#888; margin-bottom:20px;">共 0 篇</p>
            <div id="blog-list"><div class="empty-tip">加载中...</div></div>
        </div>
        <!-- 详情 -->
        <div id="view-detail" class="view">
            <div class="detail-back" onclick="goHome()"><i class="fas fa-arrow-left"></i> 返回</div>
            <div id="detail-content"></div>
            <div id="comments-area" style="margin-top:24px;"></div>
        </div>
        <!-- 发布页面 -->
        <div id="view-publish" class="view">
            <h2 style="font-weight:300; font-size:26px;"><i class="fas fa-feather-alt"></i> 发布新文章</h2>
            <form class="publish-form" id="publish-form">
                <div class="form-group">
                    <label for="pub-title">标题</label>
                    <input type="text" id="pub-title" placeholder="输入标题" required />
                </div>
                <div class="form-group">
                    <label>封面图片</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="cover-file" accept="image/*" />
                        <span style="color:#888; font-size:13px;">或输入网络图片URL</span>
                        <input type="text" id="cover-url" placeholder="https://example.com/cover.jpg" style="flex:1; min-width:150px;" />
                    </div>
                    <img id="cover-preview" class="preview-img" style="display:none;" />
                </div>
                <div class="form-group">
                    <label>正文</label>
                    <div style="display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap;">
                        <button type="button" class="insert-image-btn" onclick="insertImage()"><i class="fas fa-image"></i> 插入图片</button>
                        <input type="file" id="content-image-input" accept="image/*" style="display:none;" onchange="uploadContentImage(event)" />
                    </div>
                    <textarea id="pub-content" placeholder="正文内容（支持 Markdown 图片语法：![alt](url)）" required></textarea>
                </div>
                <button type="submit" class="submit-btn" style="padding:10px 32px;">发布文章</button>
            </form>
        </div>
        <!-- 管理 -->
        <div id="view-admin" class="view">
            <h2 style="font-weight:300; font-size:26px;"><i class="fas fa-user-shield"></i> 管理后台</h2>
            <p id="admin-status" style="color:#888; margin-bottom:20px;">请登录</p>
            <div id="admin-login-box">
                <div class="login-form">
                    <h4 style="font-weight:400; margin-bottom:12px;">管理员登录</h4>
                    <label>用户名</label><input type="text" id="login-username" placeholder="用户名" autocomplete="off" />
                    <label>密码</label><input type="password" id="login-password" placeholder="密码" autocomplete="new-password" />
                    <button class="login-btn" onclick="handleLogin()">登录</button>
                    <div class="login-error" id="login-error">用户名或密码错误</div>
                </div>
            </div>
            <div id="admin-panel" style="display:none;">
                <div id="admin-content">
                    <!-- 修改博客标题 -->
                    <div class="admin-section super-only config-area">
                        <h4><i class="fas fa-edit"></i> 修改博客标题</h4>
                        <div style="display:flex; gap:8px; flex-wrap:wrap;">
                            <input type="text" id="blog-title-input" placeholder="输入新标题" style="flex:1; min-width:200px;" />
                            <button class="submit-btn" onclick="handleUpdateTitle()">保存</button>
                        </div>
                    </div>
                    <!-- 自定义强调色 -->
                    <div class="admin-section super-only config-area">
                        <h4><i class="fas fa-palette"></i> 自定义强调色</h4>
                        <div class="color-picker-wrapper">
                            <input type="color" id="theme-color-picker" value="#4CAF50" />
                            <span style="color:#888; font-size:13px;">选择颜色，保存后立即生效</span>
                            <button class="submit-btn" onclick="handleUpdateThemeColor()">保存颜色</button>
                        </div>
                    </div>
                    <!-- 修改显示名 -->
                    <div class="admin-section admin-only">
                        <h4><i class="fas fa-user-tag"></i> 修改我的显示名</h4>
                        <div style="display:flex; gap:8px; flex-wrap:wrap;">
                            <input type="text" id="display-name-input" placeholder="新显示名" style="flex:1; min-width:200px;" />
                            <button class="submit-btn" onclick="handleUpdateDisplayName()">更新</button>
                        </div>
                    </div>
                    <!-- 修改密码 -->
                    <div class="admin-section admin-only change-pwd-area">
                        <h4><i class="fas fa-key"></i> 修改密码</h4>
                        <div style="display:flex; gap:8px; flex-wrap:wrap;">
                            <input type="password" id="old-pwd" placeholder="旧密码" style="flex:1; min-width:120px;" />
                            <input type="password" id="new-pwd" placeholder="新密码" style="flex:1; min-width:120px;" />
                            <button class="submit-btn" onclick="handleChangePassword()">修改</button>
                        </div>
                    </div>
                    <!-- 文章列表 -->
                    <div class="admin-section admin-only">
                        <h4><i class="fas fa-list-ul"></i> 我的文章</h4>
                        <div id="admin-post-list"></div>
                    </div>
                    <!-- 清空文章 -->
                    <div class="admin-section super-only">
                        <h4><i class="fas fa-trash-alt"></i> 危险操作</h4>
                        <button class="danger-btn" onclick="handleClearAllPosts()">清空所有文章</button>
                        <p style="color:#e17055; font-size:13px; margin-top:8px;">此操作将删除所有文章，不可恢复！</p>
                    </div>
                    <!-- 用户管理 -->
                    <div class="admin-section super-only" id="user-mgmt-section">
                        <h4><i class="fas fa-users-cog"></i> 管理员管理</h4>
                        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
                            <input type="text" id="new-username" placeholder="新管理员用户名" style="flex:1; min-width:120px;" />
                            <input type="password" id="new-password" placeholder="密码" style="flex:1; min-width:120px;" />
                            <button onclick="handleCreateUser()" class="submit-btn">创建</button>
                        </div>
                        <div id="user-list"></div>
                    </div>
                </div>
                <button onclick="handleLogout()" style="background:transparent;border:1px solid #ddd;padding:8px 20px;border-radius:24px;cursor:pointer;margin-top:10px;">退出登录</button>
            </div>
        </div>
    </div>
</div>
<div class="toast-container" id="toast-container"></div>

<script>
    // ============================================================
    //  前端逻辑（含发布、图片上传、显示名、强调色等）
    // ============================================================
    const API_BASE = '/api';
    let currentUser = null;
    let posts = [];
    let currentView = 'home';
    let blogTitle = '我的博客';
    let themeColor = '#4CAF50';

    // ---------- 工具 ----------
    function showToast(msg, type='info') {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.innerHTML = msg;
        container.appendChild(el);
        setTimeout(() => { el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3000);
    }

    async function apiFetch(endpoint, options={}) {
        const res = await fetch(API_BASE+endpoint, {
            ...options,
            headers: { 'Content-Type': 'application/json', ...(options.headers||{}) }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '请求失败');
        return data;
    }

    function formatDate(ts) {
        const d = new Date(ts);
        return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ---------- 应用主题色 ----------
    function applyThemeColor(color) {
        if (color) {
            document.documentElement.style.setProperty('--theme-color', color);
            // 更新按钮背景色
            document.querySelectorAll('.admin-btn, .publish-btn, .login-btn, .submit-btn, .insert-image-btn, .comment-input-area button').forEach(el => {
                if (!el.classList.contains('danger-btn') && !el.classList.contains('del-btn')) {
                    el.style.backgroundColor = color;
                }
            });
        }
    }

    // ---------- 加载配置 ----------
    async function loadBlogConfig() {
        try {
            const data = await apiFetch('/config');
            if (data) {
                if (data.blogTitle) {
                    blogTitle = data.blogTitle;
                    document.title = blogTitle;
                    document.getElementById('site-title').textContent = blogTitle;
                    document.getElementById('home-title').textContent = blogTitle;
                }
                if (data.themeColor) {
                    themeColor = data.themeColor;
                    applyThemeColor(themeColor);
                    document.getElementById('theme-color-picker').value = themeColor;
                }
                if (data.wallpaper) {
                    document.body.style.backgroundImage = `url(${data.wallpaper})`;
                }
            }
        } catch (err) {
            console.warn('无法加载配置');
        }
    }

    // ---------- 文章列表 ----------
    async function loadPosts() {
        try {
            const data = await apiFetch('/posts');
            posts = data.posts || [];
            renderPostList();
        } catch(err) {
            showToast('加载文章失败: '+err.message, 'error');
            document.getElementById('blog-list').innerHTML = '<div class="empty-tip">加载失败</div>';
        }
    }

    function renderPostList() {
        const list = document.getElementById('blog-list');
        const count = document.getElementById('post-count');
        if (!posts.length) {
            list.innerHTML = '<div class="empty-tip">📭 暂无文章</div>';
            count.textContent = '共 0 篇';
            return;
        }
        count.textContent = `共 ${posts.length} 篇`;
        const sorted = [...posts].sort((a,b) => b.createdAt - a.createdAt);
        list.innerHTML = sorted.map(p => `
            <div class="blog-card" onclick="viewPost('${p.id}')">
                ${p.cover ? `<img src="${escapeHtml(p.cover)}" class="cover-img" alt="封面" />` : ''}
                <h3>${escapeHtml(p.title)} <span class="post-author">by ${escapeHtml(p.authorDisplay || p.author || '未知')}</span></h3>
                <div class="meta"><span><i class="far fa-calendar-alt"></i> ${formatDate(p.createdAt)}</span> <span><i class="far fa-eye"></i> ${p.views||0}</span></div>
                <div class="summary">${escapeHtml(p.content ? p.content.slice(0,120) : '')}${p.content && p.content.length>120?'...':''}</div>
            </div>
        `).join('');
    }

    // ---------- 查看文章 ----------
    async function viewPost(id) {
        try {
            const data = await apiFetch(`/posts/${id}`);
            const post = data.post;
            if (!post) throw new Error('文章不存在');
            switchView('detail');
            document.getElementById('detail-content').innerHTML = `
                <h1 class="detail-title">${escapeHtml(post.title)}</h1>
                <div class="detail-meta"><i class="far fa-calendar-alt"></i> ${formatDate(post.createdAt)} &nbsp;|&nbsp; <i class="far fa-eye"></i> ${post.views||0} &nbsp;|&nbsp; 作者: ${escapeHtml(post.authorDisplay || post.author || '未知')}</div>
                <div class="detail-content">${escapeHtml(post.content)}</div>
            `;
            renderComments(post);
            window._currentPostId = id;
        } catch(err) {
            showToast('加载文章失败: '+err.message, 'error');
        }
    }

    // ---------- 评论 ----------
    function renderComments(post) {
        const container = document.getElementById('comments-area');
        let html = `<div class="comments-section"><h4>💬 评论 (${post.comments ? post.comments.length : 0})</h4>`;
        if (post.comments && post.comments.length > 0) {
            const sorted = [...post.comments].sort((a,b) => a.createdAt - b.createdAt);
            sorted.forEach(c => {
                html += `
                    <div class="comment-item">
                        <span class="comment-author">${escapeHtml(c.authorDisplay || c.author)}</span>
                        <span class="comment-time">${formatDate(c.createdAt)}</span>
                        ${ (currentUser && (currentUser.username === c.author || currentUser.role === 'super_admin')) ? `<span class="comment-delete" onclick="deleteComment('${c.id}')"><i class="fas fa-times"></i></span>` : '' }
                        <div class="comment-content">${escapeHtml(c.content)}</div>
                    </div>
                `;
            });
        } else {
            html += `<p style="color:#999; font-size:14px;">暂无评论，来说点什么吧</p>`;
        }
        if (currentUser) {
            html += `
                <div class="comment-input-area">
                    <input type="text" id="comment-input" placeholder="写下你的评论..." maxlength="500" />
                    <button onclick="submitComment()">发表</button>
                </div>
            `;
        } else {
            html += `<p style="color:#999; font-size:14px; margin-top:12px;"><a href="#" onclick="switchView('admin');return false;">登录</a> 后发表评论</p>`;
        }
        html += `</div>`;
        container.innerHTML = html;
    }

    async function submitComment() {
        if (!currentUser) { showToast('请先登录', 'error'); return; }
        const input = document.getElementById('comment-input');
        if (!input) return;
        const content = input.value.trim();
        if (!content) { showToast('评论不能为空', 'error'); return; }
        const postId = window._currentPostId;
        try {
            await apiFetch(`/posts/${postId}/comments`, {
                method: 'POST',
                body: JSON.stringify({ content })
            });
            showToast('评论发表成功', 'success');
            viewPost(postId);
        } catch(err) {
            showToast('评论失败: '+err.message, 'error');
        }
    }

    async function deleteComment(commentId) {
        if (!confirm('确定删除这条评论？')) return;
        const postId = window._currentPostId;
        try {
            await apiFetch(`/posts/${postId}/comments/${commentId}`, { method: 'DELETE' });
            showToast('评论已删除', 'success');
            viewPost(postId);
        } catch(err) {
            showToast('删除失败: '+err.message, 'error');
        }
    }

    function goHome() { switchView('home'); }

    // ---------- 视图切换 ----------
    function switchView(view) {
        currentView = view;
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        if (view === 'home') {
            document.getElementById('view-home').classList.add('active');
            loadPosts();
        } else if (view === 'detail') {
            document.getElementById('view-detail').classList.add('active');
        } else if (view === 'publish') {
            document.getElementById('view-publish').classList.add('active');
            if (!currentUser) {
                showToast('请先登录再发布', 'info');
                switchView('admin');
            }
        } else if (view === 'admin') {
            document.getElementById('view-admin').classList.add('active');
            loadAdminPanel();
        }
        document.querySelectorAll('.nav-links a').forEach(a => a.style.opacity='0.7');
        document.querySelectorAll('.nav-links a').forEach(a => { if (a.dataset.view===view) a.style.opacity='1'; });
        window.scrollTo(0,0);
    }

    document.querySelectorAll('.nav-links a').forEach(a => {
        a.addEventListener('click', (e) => {
            e.preventDefault();
            const view = a.dataset.view;
            if (view === 'admin' && !currentUser) {
                switchView('admin');
            } else if (view === 'publish' && !currentUser) {
                showToast('请先登录', 'info');
                switchView('admin');
            } else {
                switchView(view);
            }
        });
    });

    // ---------- 管理后台 ----------
    async function loadAdminPanel() {
        try {
            const data = await apiFetch('/auth/status');
            if (data.isAdmin && data.user) {
                currentUser = data.user;
                document.getElementById('admin-login-box').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('admin-status').textContent = `✅ 已登录 (${currentUser.displayName || currentUser.username})`;
                // 权限控制
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                if (currentUser.role === 'super_admin') {
                    document.querySelectorAll('.super-only').forEach(el => el.style.display = 'block');
                    try {
                        const cfg = await apiFetch('/config');
                        if (cfg.blogTitle) {
                            document.getElementById('blog-title-input').value = cfg.blogTitle;
                        }
                        if (cfg.themeColor) {
                            document.getElementById('theme-color-picker').value = cfg.themeColor;
                        }
                    } catch (e) {}
                } else {
                    document.querySelectorAll('.super-only').forEach(el => el.style.display = 'none');
                }
                document.getElementById('display-name-input').value = currentUser.displayName || currentUser.username;
                await loadAdminPosts();
                if (currentUser.role === 'super_admin') loadUserList();
            } else {
                currentUser = null;
                document.getElementById('admin-login-box').style.display = 'block';
                document.getElementById('admin-panel').style.display = 'none';
                document.getElementById('admin-status').textContent = '🔒 请登录';
                document.getElementById('login-error').classList.remove('show');
            }
        } catch(err) {
            currentUser = null;
            document.getElementById('admin-login-box').style.display = 'block';
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('admin-status').textContent = '🔒 请登录';
        }
    }

    async function loadAdminPosts() {
        try {
            const data = await apiFetch('/posts');
            posts = data.posts || [];
            renderAdminPostList();
        } catch(err) {
            showToast('加载文章失败', 'error');
        }
    }

    function renderAdminPostList() {
        const container = document.getElementById('admin-post-list');
        if (!posts.length) {
            container.innerHTML = '<div class="empty-tip">暂无文章</div>';
            return;
        }
        const sorted = [...posts].sort((a,b) => b.createdAt - a.createdAt);
        container.innerHTML = sorted.map(p => `
            <div class="admin-blog-item">
                <div><span class="title">${escapeHtml(p.title)}</span> <span class="date" style="color:#888; font-size:13px;">${formatDate(p.createdAt)}</span> <span style="font-size:12px;color:#888;">by ${escapeHtml(p.authorDisplay || p.author || '未知')}</span></div>
                <button class="del-btn" onclick="handleDelete('${p.id}')"><i class="fas fa-trash-alt"></i> 删除</button>
            </div>
        `).join('');
    }

    // ---------- 用户管理（超级管理员） ----------
    async function loadUserList() {
        if (!currentUser || currentUser.role !== 'super_admin') return;
        try {
            const data = await apiFetch('/users');
            const users = data.users || [];
            const container = document.getElementById('user-list');
            if (!users.length) {
                container.innerHTML = '<div class="empty-tip">暂无其他管理员</div>';
                return;
            }
            container.innerHTML = users.map(u => `
                <div class="user-item" style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee; align-items:center;">
                    <span>${escapeHtml(u.username)} (${escapeHtml(u.displayName || u.username)}) ${u.role === 'super_admin' ? '⭐' : ''}</span>
                    <div>
                        ${u.role !== 'super_admin' ? `<button class="del-btn" onclick="handleDeleteUser('${u.username}')">删除</button>` : ''}
                        ${u.username === currentUser.username ? '' : `<button class="reset-btn" style="background:#0984e3;color:#fff;border:none;padding:2px 12px;border-radius:16px;cursor:pointer;margin-left:6px;" onclick="handleResetPassword('${u.username}')">重置密码</button>`}
                    </div>
                </div>
            `).join('');
        } catch(err) {
            showToast('加载用户列表失败', 'error');
        }
    }

    async function handleCreateUser() {
        const username = document.getElementById('new-username').value.trim();
        const password = document.getElementById('new-password').value.trim();
        if (!username || !password) {
            showToast('请填写用户名和密码', 'error');
            return;
        }
        try {
            await apiFetch('/users', {
                method: 'POST',
                body: JSON.stringify({ username, password })
            });
            showToast('管理员创建成功', 'success');
            document.getElementById('new-username').value = '';
            document.getElementById('new-password').value = '';
            loadUserList();
        } catch(err) {
            showToast('创建失败: '+err.message, 'error');
        }
    }

    async function handleDeleteUser(username) {
        if (!confirm(`确认删除管理员 ${username}？其所有文章也将被删除。`)) return;
        try {
            await apiFetch(`/users/${username}`, { method: 'DELETE' });
            showToast('管理员已删除', 'success');
            loadUserList();
            loadAdminPosts();
        } catch(err) {
            showToast('删除失败: '+err.message, 'error');
        }
    }

    // ---------- 修改显示名 ----------
    async function handleUpdateDisplayName() {
        if (!currentUser) { showToast('请先登录', 'error'); return; }
        const newName = document.getElementById('display-name-input').value.trim();
        if (!newName) { showToast('显示名不能为空', 'error'); return; }
        try {
            await apiFetch(`/users/${currentUser.username}/displayname`, {
                method: 'PUT',
                body: JSON.stringify({ displayName: newName })
            });
            showToast('显示名已更新', 'success');
            currentUser.displayName = newName;
            document.getElementById('admin-status').textContent = `✅ 已登录 (${newName})`;
            if (currentView === 'home') loadPosts();
        } catch(err) {
            showToast('更新失败: '+err.message, 'error');
        }
    }

    // ---------- 修改密码 ----------
    async function handleChangePassword() {
        if (!currentUser) { showToast('请先登录', 'error'); return; }
        const oldPwd = document.getElementById('old-pwd').value.trim();
        const newPwd = document.getElementById('new-pwd').value.trim();
        if (!newPwd) { showToast('新密码不能为空', 'error'); return; }
        if (newPwd.length < 3) { showToast('新密码长度至少3位', 'error'); return; }
        try {
            await apiFetch(`/users/${currentUser.username}/password`, {
                method: 'PUT',
                body: JSON.stringify({ oldPassword: oldPwd, newPassword: newPwd })
            });
            showToast('密码修改成功，请重新登录', 'success');
            document.getElementById('old-pwd').value = '';
            document.getElementById('new-pwd').value = '';
            await handleLogout();
        } catch(err) {
            showToast('修改失败: '+err.message, 'error');
        }
    }

    async function handleResetPassword(username) {
        if (!confirm(`确认重置用户 ${username} 的密码为 "123456"？`)) return;
        try {
            await apiFetch(`/users/${username}/password`, {
                method: 'PUT',
                body: JSON.stringify({ oldPassword: '', newPassword: '123456' })
            });
            showToast(`用户 ${username} 的密码已重置为 123456`, 'success');
        } catch(err) {
            showToast('重置失败: '+err.message, 'error');
        }
    }

    // ---------- 修改博客标题 ----------
    async function handleUpdateTitle() {
        if (!currentUser || currentUser.role !== 'super_admin') {
            showToast('权限不足', 'error');
            return;
        }
        const newTitle = document.getElementById('blog-title-input').value.trim();
        if (!newTitle) { showToast('标题不能为空', 'error'); return; }
        try {
            await apiFetch('/config', {
                method: 'PUT',
                body: JSON.stringify({ blogTitle: newTitle })
            });
            showToast('标题修改成功', 'success');
            blogTitle = newTitle;
            document.title = newTitle;
            document.getElementById('site-title').textContent = newTitle;
            document.getElementById('home-title').textContent = newTitle;
        } catch(err) {
            showToast('修改失败: '+err.message, 'error');
        }
    }

    // ---------- 自定义强调色 ----------
    async function handleUpdateThemeColor() {
        if (!currentUser || currentUser.role !== 'super_admin') {
            showToast('权限不足', 'error');
            return;
        }
        const color = document.getElementById('theme-color-picker').value;
        if (!color) { showToast('请选择颜色', 'error'); return; }
        try {
            await apiFetch('/config', {
                method: 'PUT',
                body: JSON.stringify({ themeColor: color })
            });
            showToast('主题颜色已更新', 'success');
            themeColor = color;
            applyThemeColor(color);
        } catch(err) {
            showToast('更新失败: '+err.message, 'error');
        }
    }

    // ---------- 清空所有文章 ----------
    async function handleClearAllPosts() {
        if (!currentUser || currentUser.role !== 'super_admin') {
            showToast('权限不足', 'error');
            return;
        }
        if (!confirm('⚠️ 确定要删除所有文章吗？此操作不可恢复！')) return;
        if (!confirm('再次确认：清空所有文章？')) return;
        try {
            await apiFetch('/posts', { method: 'DELETE' });
            showToast('所有文章已清空', 'success');
            await loadAdminPosts();
            if (currentView === 'home') loadPosts();
        } catch(err) {
            showToast('清空失败: '+err.message, 'error');
        }
    }

    // ---------- 登录/登出 ----------
    async function handleLogin() {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value.trim();
        try {
            const data = await apiFetch('/auth/login', {
                method: 'POST',
                body: JSON.stringify({ username, password })
            });
            if (data.success && data.user) {
                currentUser = data.user;
                showToast('登录成功', 'success');
                loadAdminPanel();
                await loadBlogConfig();
                if (currentView === 'detail' && window._currentPostId) {
                    viewPost(window._currentPostId);
                }
            } else {
                document.getElementById('login-error').textContent = '用户名或密码错误';
                document.getElementById('login-error').classList.add('show');
            }
        } catch(err) {
            showToast('登录失败: '+err.message, 'error');
        }
    }

    async function handleLogout() {
        try {
            await apiFetch('/auth/logout', { method: 'POST' });
            currentUser = null;
            showToast('已退出', 'info');
            loadAdminPanel();
            if (currentView === 'admin') switchView('admin');
            if (currentView === 'detail' && window._currentPostId) {
                viewPost(window._currentPostId);
            }
        } catch(err) {
            showToast('退出失败', 'error');
        }
    }

    // ---------- 发布文章 ----------
    document.getElementById('publish-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        if (!currentUser) { showToast('请先登录', 'error'); return; }
        const title = document.getElementById('pub-title').value.trim();
        const content = document.getElementById('pub-content').value.trim();
        const coverFile = document.getElementById('cover-file').files[0];
        let coverUrl = document.getElementById('cover-url').value.trim();

        if (!title || !content) { showToast('标题和内容不能为空', 'error'); return; }

        // 如果上传了封面文件，先上传到图床
        if (coverFile) {
            try {
                const formData = new FormData();
                formData.append('image', coverFile);
                const res = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.success) {
                    coverUrl = data.url;
                } else {
                    showToast('封面上传失败，请使用URL', 'error');
                    return;
                }
            } catch(err) {
                showToast('封面上传失败: '+err.message, 'error');
                return;
            }
        }

        try {
            const data = await apiFetch('/posts', {
                method: 'POST',
                body: JSON.stringify({ title, content, cover: coverUrl })
            });
            showToast('发布成功', 'success');
            // 清空表单
            document.getElementById('pub-title').value = '';
            document.getElementById('pub-content').value = '';
            document.getElementById('cover-url').value = '';
            document.getElementById('cover-file').value = '';
            document.getElementById('cover-preview').style.display = 'none';
            // 回到首页
            switchView('home');
        } catch(err) {
            showToast('发布失败: '+err.message, 'error');
        }
    });

    // ---------- 图片插入 ----------
    function insertImage() {
        document.getElementById('content-image-input').click();
    }

    async function uploadContentImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        try {
            const formData = new FormData();
            formData.append('image', file);
            const res = await fetch('/api/upload', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            if (data.success) {
                const url = data.url;
                const textarea = document.getElementById('pub-content');
                const cursorPos = textarea.selectionStart;
                const text = textarea.value;
                const before = text.substring(0, cursorPos);
                const after = text.substring(cursorPos);
                const markdown = `\n![图片](${url})\n`;
                textarea.value = before + markdown + after;
                textarea.selectionStart = textarea.selectionEnd = cursorPos + markdown.length;
                showToast('图片插入成功', 'success');
            } else {
                showToast('图片上传失败', 'error');
            }
        } catch(err) {
            showToast('上传失败: '+err.message, 'error');
        }
        event.target.value = '';
    }

    // ---------- 封面预览 ----------
    document.getElementById('cover-file').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = document.getElementById('cover-preview');
                img.src = event.target.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });

    // ---------- 删除文章 ----------
    async function handleDelete(id) {
        if (!confirm('确认删除该文章？')) return;
        try {
            await apiFetch(`/posts/${id}`, { method: 'DELETE' });
            showToast('已删除', 'success');
            await loadAdminPosts();
            if (currentView === 'home') loadPosts();
            if (currentView === 'detail') goHome();
        } catch(err) {
            showToast('删除失败: '+err.message, 'error');
        }
    }

    // ---------- 回车登录 ----------
    document.getElementById('login-password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('login-username').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleLogin();
    });

    // ========== 初始化 ==========
    window.onload = async function() {
        await loadBlogConfig();
        switchView('home');
        try {
            const status = await apiFetch('/auth/status');
            if (status.isAdmin && status.user) {
                currentUser = status.user;
                await loadBlogConfig();
            }
        } catch (e) {}
    };

    // 暴露全局函数
    window.viewPost = viewPost;
    window.goHome = goHome;
    window.handleLogin = handleLogin;
    window.handleLogout = handleLogout;
    window.handleDelete = handleDelete;
    window.handleCreateUser = handleCreateUser;
    window.handleDeleteUser = handleDeleteUser;
    window.handleChangePassword = handleChangePassword;
    window.handleResetPassword = handleResetPassword;
    window.handleUpdateTitle = handleUpdateTitle;
    window.handleUpdateThemeColor = handleUpdateThemeColor;
    window.handleClearAllPosts = handleClearAllPosts;
    window.handleUpdateDisplayName = handleUpdateDisplayName;
    window.submitComment = submitComment;
    window.deleteComment = deleteComment;
    window.insertImage = insertImage;
    window.uploadContentImage = uploadContentImage;
    window.switchView = switchView;
</script>
</body>
</html>
