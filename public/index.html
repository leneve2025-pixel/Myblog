<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">我的博客</title>
    <!-- 字体：改用系统字体栈，移除 Google Fonts，避免在国内被墙导致首屏长时间空白 -->
    <!-- Font Awesome：非阻塞加载（media=print + onload），不阻塞首屏渲染，图标加载完成后自动生效 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" /></noscript>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #1c1c1c;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .container {
            max-width: 880px;
            margin: 0 auto;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            overflow: hidden;
            transition: background 0.3s;
        }
        body.dark .container { background: rgba(30,30,30,0.9); }
        header {
            padding: 20px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        body.dark header { border-bottom-color: rgba(255,255,255,0.08); }
        .logo {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo i { color: var(--theme-color, #4CAF50); font-size: 28px; }
        .nav-links a {
            color: #444;
            margin-left: 20px;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            padding: 6px 12px;
            border-radius: 20px;
            transition: background 0.2s;
            cursor: pointer;
        }
        body.dark .nav-links a { color: #ccc; }
        .nav-links a:hover { background: rgba(0,0,0,0.05); }
        body.dark .nav-links a:hover { background: rgba(255,255,255,0.08); }
        .nav-links .admin-btn {
            background: var(--theme-color, #4CAF50);
            color: #fff !important;
            padding: 6px 18px;
            border-radius: 24px;
        }
        body.dark .nav-links .admin-btn { color: #1c1c1c !important; }

        .main-content { padding: 28px 32px; }
        .view { display: none; animation: fadeIn 0.25s; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .blog-card {
            background: #fff;
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: box-shadow 0.2s, transform 0.2s;
            border-left: 6px solid var(--theme-color, #4CAF50);
        }
        body.dark .blog-card { background: #2a2a2a; border-left-color: var(--theme-color, #4CAF50); }
        .blog-card:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.08); transform: translateY(-2px); }
        .blog-card h3 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
        .blog-card .cover-img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin-top: 8px;
            max-height: 200px;
            object-fit: cover;
            display: block;
        }
        .meta { font-size: 13px; color: #888; display: flex; gap: 16px; flex-wrap: wrap; }
        .summary { margin-top: 10px; color: #555; font-weight: 300; line-height: 1.5; }
        body.dark .summary { color: #aaa; }

        .detail-back { color: var(--theme-color, #4CAF50); cursor: pointer; font-weight: 500; display: inline-block; margin-bottom: 16px; }
        .detail-title { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
        .detail-meta { font-size: 14px; color: #888; margin-bottom: 16px; }
        .detail-content { font-size: 16px; line-height: 1.8; white-space: pre-wrap; word-wrap: break-word; margin-bottom: 24px; }
        .detail-content img { max-width: 100%; border-radius: 12px; margin: 8px 0; }

        .comments-section { margin-top: 32px; border-top: 1px solid #ddd; padding-top: 20px; }
        body.dark .comments-section { border-top-color: #444; }
        .comments-section h4 { font-size: 18px; font-weight: 500; margin-bottom: 16px; }
        .comment-item { padding: 12px 0; border-bottom: 1px solid #eee; }
        body.dark .comment-item { border-bottom-color: #333; }
        .comment-author { font-weight: 500; font-size: 14px; }
        .comment-time { font-size: 12px; color: #999; margin-left: 12px; }
        .comment-content { margin-top: 4px; font-size: 15px; }
        .comment-delete { float: right; color: #e17055; cursor: pointer; font-size: 13px; }
        .comment-input-area { display: flex; gap: 10px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
        .comment-input-area input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 24px; font-size: 14px; background: #fff; outline: none; min-width: 150px; }
        body.dark .comment-input-area input { background: #2a2a2a; border-color: #555; color: #e0e0e0; }
        .comment-input-area button { background: var(--theme-color, #4CAF50); color: #fff; border: none; padding: 8px 20px; border-radius: 24px; font-weight: 500; cursor: pointer; }

        .login-form { max-width: 380px; margin: 30px auto; background: #fff; padding: 28px 24px; border-radius: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        body.dark .login-form { background: #2a2a2a; }
        .login-form input { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 24px; margin-bottom: 14px; font-size: 15px; background: #f9f9f9; outline: none; }
        body.dark .login-form input { background: #1c1c1c; border-color: #444; color: #e0e0e0; }
        .login-btn { width: 100%; padding: 12px; background: var(--theme-color, #4CAF50); color: #fff; border: none; border-radius: 24px; font-weight: 500; font-size: 16px; cursor: pointer; }
        body.dark .login-btn { color: #1c1c1c; }
        .login-error { color: #e17055; text-align: center; display: none; margin-top: 8px; }

        .admin-section { background: #fff; border-radius: 20px; padding: 20px 24px; margin-bottom: 20px; }
        body.dark .admin-section { background: #2a2a2a; }
        .admin-section h4 { font-size: 18px; font-weight: 500; margin-bottom: 12px; }
        .admin-section input, .admin-section textarea { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 16px; margin-bottom: 10px; font-size: 14px; background: #f9f9f9; font-family: inherit; outline: none; }
        body.dark .admin-section input, body.dark .admin-section textarea { background: #1c1c1c; border-color: #444; color: #e0e0e0; }
        .admin-section textarea { min-height: 100px; resize: vertical; }
        .submit-btn { background: var(--theme-color, #4CAF50); color: #fff; border: none; padding: 8px 24px; border-radius: 24px; font-weight: 500; cursor: pointer; }
        body.dark .submit-btn { color: #1c1c1c; }

        .admin-blog-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; align-items: center; flex-wrap: wrap; gap: 8px; }
        body.dark .admin-blog-item { border-bottom-color: #333; }
        .del-btn { background: #e17055; color: #fff; border: none; padding: 4px 14px; border-radius: 16px; cursor: pointer; }
        .danger-btn { background: #e17055; color: #fff; border: none; padding: 8px 20px; border-radius: 24px; font-weight: 500; cursor: pointer; }

        .empty-tip { color: #999; text-align: center; padding: 30px 0; }

        .toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 12px 20px; border-radius: 24px; background: #333; color: #fff; font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); animation: slideUp 0.3s ease; }
        .toast.success { background: #00b894; }
        .toast.error { background: #e17055; }
        .toast.info { background: #0984e3; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .post-author { font-weight: 500; color: var(--theme-color, #4CAF50); }
        body.dark .post-author { color: var(--theme-color, #4CAF50); }

        .user-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; align-items: center; flex-wrap: wrap; gap: 8px; }
        body.dark .user-item { border-bottom-color: #333; }
        .user-item .del-btn { background: #e17055; color: #fff; border: none; padding: 2px 12px; border-radius: 16px; cursor: pointer; }
        .user-item .reset-btn { background: #0984e3; color: #fff; border: none; padding: 2px 12px; border-radius: 16px; cursor: pointer; }

        .publish-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .publish-toolbar button { background: var(--theme-color, #4CAF50); color: #fff; border: none; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        .publish-toolbar button:hover { opacity: 0.8; }
        .cover-preview { max-width: 100%; max-height: 200px; border-radius: 12px; margin-top: 8px; display: none; }
        .file-input-label { display: inline-block; background: var(--theme-color, #4CAF50); color: #fff; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        .file-input-label:hover { opacity: 0.8; }
        .file-input-label input { display: none; }

        /* 加载圈 */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid var(--theme-color, #4CAF50);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #loading-screen p { margin-top: 20px; color: #888; font-size: 16px; }
        #loading-error { margin-top: 10px; color: #e17055; font-size: 14px; display: none; }
        #retry-btn {
            margin-top: 10px;
            padding: 8px 20px;
            background: var(--theme-color, #4CAF50);
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            display: none;
        }

        @media (max-width: 640px) {
            .main-content { padding: 16px; }
            header { flex-direction: column; align-items: stretch; gap: 10px; }
            .nav-links { display: flex; justify-content: center; flex-wrap: wrap; }
            .comment-input-area { flex-direction: column; }
            .comment-input-area input { width: 100%; }
        }
    </style>
</head>
<body>

<!-- ===== 加载圈 ===== -->
<div id="loading-screen">
    <div class="spinner"></div>
    <p>加载中...</p>
    <p id="loading-error"></p>
    <button id="retry-btn" onclick="location.reload()">重试</button>
</div>

<div class="container">
    <header>
        <div class="logo"><i class="fas fa-feather-alt"></i> <span id="site-title">MyBlog</span></div>
        <div class="nav-links">
            <a data-view="home"><i class="fas fa-home"></i> 首页</a>
            <a data-view="publish" class="admin-btn"><i class="fas fa-plus-circle"></i> 发布</a>
            <a data-view="admin" class="admin-btn"><i class="fas fa-user-cog"></i> 管理</a>
        </div>
    </header>
    <div class="main-content">
        <!-- 首页 -->
        <div id="view-home" class="view active">
            <h1 id="home-title" style="font-weight:300; font-size:28px;">所有文章</h1>
            <p id="post-count" style="color:#888; margin-bottom:20px;">共 0 篇</p>
            <div id="blog-list"><div class="empty-tip">加载中...</div></div>
        </div>

        <!-- 详情 -->
        <div id="view-detail" class="view">
            <div class="detail-back" onclick="goHome()"><i class="fas fa-arrow-left"></i> 返回</div>
            <div id="detail-content"></div>
            <div id="comments-area" style="margin-top:24px;"></div>
        </div>

        <!-- 发布页面 -->
        <div id="view-publish" class="view">
            <h2 style="font-weight:300; font-size:26px; margin-bottom:16px;"><i class="fas fa-feather-alt"></i> 发布新文章</h2>
            <div class="admin-section">
                <input type="text" id="pub-title" placeholder="文章标题" style="width:100%; padding:12px; border-radius:16px; border:1px solid #ddd; font-size:16px;" oninput="saveDraft()" />
                <div style="margin:12px 0;">
                    <label class="file-input-label">
                        <i class="fas fa-image"></i> 选择封面图片
                        <input type="file" id="cover-upload" accept="image/*" />
                    </label>
                    <span style="margin-left:12px; color:#888; font-size:14px;">（或粘贴网络图片URL）</span>
                    <input type="text" id="pub-cover-url" placeholder="或直接粘贴图片URL" style="width:100%; margin-top:8px; padding:10px; border-radius:16px; border:1px solid #ddd;" oninput="saveDraft()" />
                    <img id="cover-preview" class="cover-preview" alt="封面预览" />
                </div>
                <div style="margin:12px 0;">
                    <div class="publish-toolbar">
                        <button onclick="insertImage()"><i class="fas fa-image"></i> 插入图片</button>
                        <input type="file" id="image-upload" accept="image/*" style="display:none;" />
                    </div>
                    <textarea id="pub-content" placeholder="正文内容（支持Markdown图片语法 ![]()）" style="width:100%; min-height:200px; padding:12px; border-radius:16px; border:1px solid #ddd; font-size:15px; line-height:1.6; resize:vertical;" oninput="saveDraft()"></textarea>
                </div>
                <button id="publish-btn" class="submit-btn" onclick="handlePublish()"><i class="fas fa-paper-plane"></i> 发布文章</button>
            </div>
        </div>

        <!-- 管理 -->
        <div id="view-admin" class="view">
            <h2 style="font-weight:300; font-size:26px;"><i class="fas fa-user-shield"></i> 管理后台</h2>
            <p id="admin-status" style="color:#888; margin-bottom:20px;">请登录</p>
            <div id="admin-login-box">
                <div class="login-form">
                    <h4 style="font-weight:400; margin-bottom:12px;">管理员登录</h4>
                    <label>用户名</label><input type="text" id="login-username" placeholder="用户名" autocomplete="off" />
                    <label>密码</label><input type="password" id="login-password" placeholder="密码" autocomplete="new-password" />
                    <button class="login-btn" onclick="handleLogin()">登录</button>
                    <div class="login-error" id="login-error">用户名或密码错误</div>
                </div>
            </div>
            <div id="admin-panel" style="display:none;">
                <div id="admin-content">
                    <!-- 修改博客标题 -->
                    <div class="admin-section super-only config-area">
                        <h4><i class="fas fa-edit"></i> 修改博客标题</h4>
                        <div style="display:flex; gap:8px; flex-wrap:wrap;">
                            <input type="text" id="blog-title-input" placeholder="输入新标题" style="flex:1; min-width:200px;" />
                            <button class="submit-btn" onclick="handleUpdateTitle()">保存</button>
                        </div>
                    </div>
                    <!-- 修改显示名 -->
                    <div class="admin-section admin-only">
                        <h4><i class="fas fa-user-tag"></i> 修改我的显示名</h4>
                        <div style="display:flex; gap:8px; flex-wrap:wrap;">
                            <input type="text" id="display-name-input" placeholder="新显示名" style="flex:1; min-width:200px;" />
                            <button class="submit-btn" onclick="handleUpdateDisplayName()">更新</button>
                        </div>
                    </div>
                    <!-- 修改头像 -->
                    <div class="admin-section admin-only">
                        <h4><i class="fas fa-user-circle"></i> 修改头像</h4>
                        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                            <img id="avatar-preview" src="" alt="当前头像" style="width:60px; height:60px; border-radius:50%; object-fit:cover; border:2px solid #ddd; display:none;" />
                            <label class="file-input-label">
                                <i class="fas fa-upload"></i> 选择图片
                                <input type="file" id="avatar-upload" accept="image/*" />
                            </label>
                            <input type="text" id="avatar-url" placeholder="或粘贴图片URL" style="flex:1; min-width:150px; padding:8px 12px; border-radius:16px; border:1px solid #ddd;" />
                            <button class="submit-btn" onclick="handleUpdateAvatar()">保存头像</button>
                        </div>
                    </div>
                    <!-- 修改密码 -->
                    <div class="admin-section admin-only change-pwd-area">
                        <h4><i class="fas fa-key"></i> 修改密码</h4>
                        <div style="display:flex; gap:8px; flex-wrap:wrap;">
                            <input type="password" id="old-pwd" placeholder="旧密码" style="flex:1; min-width:120px;" />
                            <input type="password" id="new-pwd" placeholder="新密码" style="flex:1; min-width:120px;" />
                            <button class="submit-btn" onclick="handleChangePassword()">修改</button>
                        </div>
                    </div>
                    <!-- 发布文章（快捷） -->
                    <div class="admin-section admin-only">
                        <h4><i class="fas fa-plus-circle"></i> 发布新文章</h4>
                        <form class="add-form" onsubmit="handleAddPost(event)">
                            <input type="text" id="add-title" placeholder="标题" required />
                            <input type="text" id="add-cover" placeholder="封面图URL（可选）" />
                            <textarea id="add-content" placeholder="正文" required></textarea>
                            <button type="submit" class="submit-btn">发布</button>
                        </form>
                    </div>
                    <!-- 文章列表 -->
                    <div class="admin-section admin-only">
                        <h4><i class="fas fa-list-ul"></i> 我的文章</h4>
                        <div id="admin-post-list"></div>
                    </div>
                    <!-- 清空文章 -->
                    <div class="admin-section super-only">
                        <h4><i class="fas fa-trash-alt"></i> 危险操作</h4>
                        <button class="danger-btn" onclick="handleClearAllPosts()">清空所有文章</button>
                        <p style="color:#e17055; font-size:13px; margin-top:8px;">此操作将删除所有文章，不可恢复！</p>
                    </div>
                    <!-- 用户管理 -->
                    <div class="admin-section super-only" id="user-mgmt-section">
                        <h4><i class="fas fa-users-cog"></i> 管理员管理</h4>
                        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
                            <input type="text" id="new-username" placeholder="新管理员用户名" style="flex:1; min-width:120px;" />
                            <input type="password" id="new-password" placeholder="密码" style="flex:1; min-width:120px;" />
                            <button onclick="handleCreateUser()" class="submit-btn">创建</button>
                        </div>
                        <div id="user-list"></div>
                    </div>
                </div>
                <button onclick="handleLogout()" style="background:transparent;border:1px solid #ddd;padding:8px 20px;border-radius:24px;cursor:pointer;margin-top:10px;">退出登录</button>
            </div>
        </div>
    </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
    // ============================================================
    //  自动检测子路径
    // ============================================================
    const BASE_PATH = window.location.pathname.match(/^\/[^\/]+/)?.[0] || '';
    const API_BASE = BASE_PATH + '/api';

    // ============================================================
    //  全局状态
    // ============================================================
    let currentUser = null;
    let posts = [];
    let currentView = 'home';
    let blogTitle = '我的博客';
    let themeColor = '#4CAF50';
    let appLoaded = false;

    // ============================================================
    //  加载圈控制
    // ============================================================
    function showLoading() {
        document.getElementById('loading-screen').classList.remove('hidden');
    }

    function hideLoading() {
        document.getElementById('loading-screen').classList.add('hidden');
        appLoaded = true;
    }

    function showLoadingError(msg) {
        document.getElementById('loading-error').textContent = msg || '加载失败，请刷新重试';
        document.getElementById('loading-error').style.display = 'block';
        document.getElementById('retry-btn').style.display = 'block';
    }

    // ============================================================
    //  工具函数
    // ============================================================
    function showToast(msg, type='info') {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.innerHTML = msg;
        container.appendChild(el);
        setTimeout(() => { el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3000);
    }

    async function apiFetch(endpoint, options={}) {
        const res = await fetch(API_BASE+endpoint, {
            ...options,
            headers: { 'Content-Type': 'application/json', ...(options.headers||{}) }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '请求失败');
        return data;
    }

    function formatDate(ts) {
        const d = new Date(ts);
        return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function applyThemeColor(color) {
        document.documentElement.style.setProperty('--theme-color', color);
        document.querySelectorAll('.admin-btn, .login-btn, .submit-btn, .publish-toolbar button, .file-input-label, .comment-input-area button').forEach(el => {
            if (!el.classList.contains('danger-btn') && !el.classList.contains('del-btn') && !el.classList.contains('reset-btn')) {
                el.style.backgroundColor = color;
            }
        });
    }

    // ============================================================
    //  草稿管理
    // ============================================================
    function loadDraft() {
        try {
            const draft = localStorage.getItem('blog_draft');
            if (draft) {
                const data = JSON.parse(draft);
                const titleInput = document.getElementById('pub-title');
                const contentInput = document.getElementById('pub-content');
                const coverInput = document.getElementById('pub-cover-url');
                if (titleInput) titleInput.value = data.title || '';
                if (contentInput) contentInput.value = data.content || '';
                if (coverInput) coverInput.value = data.cover || '';
                if (data.cover) {
                    const preview = document.getElementById('cover-preview');
                    if (preview) {
                        preview.src = data.cover;
                        preview.style.display = 'block';
                    }
                }
                if (data.title || data.content) {
                    showToast('已恢复未发布的草稿', 'info');
                }
            }
        } catch (e) {}
    }

    let draftTimer = null;
    function saveDraft() {
        clearTimeout(draftTimer);
        draftTimer = setTimeout(() => {
            try {
                const title = document.getElementById('pub-title')?.value?.trim() || '';
                const content = document.getElementById('pub-content')?.value?.trim() || '';
                const cover = document.getElementById('pub-cover-url')?.value?.trim() || '';
                if (title || content || cover) {
                    localStorage.setItem('blog_draft', JSON.stringify({ title, content, cover }));
                } else {
                    localStorage.removeItem('blog_draft');
                }
            } catch (e) {}
        }, 3000);
    }

    function clearDraft() {
        localStorage.removeItem('blog_draft');
    }

    // ============================================================
    //  文章列表
    // ============================================================
    async function loadPosts() {
        try {
            const data = await apiFetch('/posts');
            posts = data.posts || [];
            renderPostList();
        } catch(err) {
            showToast('加载文章失败: '+err.message, 'error');
            document.getElementById('blog-list').innerHTML = '<div class="empty-tip">加载失败</div>';
        }
    }

    function renderPostList() {
        const list = document.getElementById('blog-list');
        const count = document.getElementById('post-count');
        if (!posts.length) {
            list.innerHTML = '<div class="empty-tip">📭 暂无文章</div>';
            count.textContent = '共 0 篇';
            return;
        }
        count.textContent = `共 ${posts.length} 篇`;
        const sorted = [...posts].sort((a,b) => b.createdAt - a.createdAt);
        list.innerHTML = sorted.map(p => `
            <div class="blog-card" onclick="viewPost('${p.id}')">
                <h3>
                    ${p.authorAvatar ? `<img src="${escapeHtml(p.authorAvatar)}" style="width:24px; height:24px; border-radius:50%; object-fit:cover; vertical-align:middle; margin-right:6px;" />` : ''}
                    ${escapeHtml(p.title)}
                    <span class="post-author">by ${escapeHtml(p.authorDisplay || p.author || '未知')}</span>
                </h3>
                ${p.cover ? `<img class="cover-img" src="${escapeHtml(p.cover)}" alt="封面" />` : ''}
                <div class="meta"><span><i class="far fa-calendar-alt"></i> ${formatDate(p.createdAt)}</span> <span><i class="far fa-eye"></i> ${p.views||0}</span></div>
                <div class="summary">${escapeHtml(p.content ? p.content.slice(0,120) : '')}${p.content && p.content.length>120?'...':''}</div>
            </div>
        `).join('');
    }

    // ============================================================
    //  文章详情
    // ============================================================
    async function viewPost(id) {
        try {
            const data = await apiFetch(`/posts/${id}`);
            const post = data.post;
            if (!post) throw new Error('文章不存在');
            switchView('detail');
            document.getElementById('detail-content').innerHTML = `
                <h1 class="detail-title">${escapeHtml(post.title)}</h1>
                ${post.authorAvatar ? `<img src="${escapeHtml(post.authorAvatar)}" style="width:28px; height:28px; border-radius:50%; object-fit:cover; vertical-align:middle; margin-right:6px;" />` : ''}
                <div class="detail-meta">
                    <i class="far fa-calendar-alt"></i> ${formatDate(post.createdAt)} &nbsp;|&nbsp;
                    <i class="far fa-eye"></i> ${post.views||0} &nbsp;|&nbsp;
                    作者: ${escapeHtml(post.authorDisplay || post.author || '未知')}
                </div>
                ${post.cover ? `<img src="${escapeHtml(post.cover)}" style="max-width:100%; border-radius:12px; margin-bottom:16px;" alt="封面" />` : ''}
                <div class="detail-content">${escapeHtml(post.content)}</div>
            `;
            renderComments(post);
            window._currentPostId = id;
        } catch(err) {
            showToast('加载文章失败: '+err.message, 'error');
        }
    }

    // ============================================================
    //  评论
    // ============================================================
    function renderComments(post) {
        const container = document.getElementById('comments-area');
        let html = `<div class="comments-section"><h4>💬 评论 (${post.comments ? post.comments.length : 0})</h4>`;
        if (post.comments && post.comments.length > 0) {
            const sorted = [...post.comments].sort((a,b) => a.createdAt - b.createdAt);
            sorted.forEach(c => {
                html += `
                    <div class="comment-item">
                        <span class="comment-author">${escapeHtml(c.authorDisplay || c.author)}</span>
                        <span class="comment-time">${formatDate(c.createdAt)}</span>
                        ${ (currentUser && (currentUser.username === c.author || currentUser.role === 'super_admin')) ? `<span class="comment-delete" onclick="deleteComment('${c.id}')"><i class="fas fa-times"></i></span>` : '' }
                        <div class="comment-content">${escapeHtml(c.content)}</div>
                    </div>
                `;
            });
        } else {
            html += `<p style="color:#999; font-size:14px;">暂无评论，来说点什么吧</p>`;
        }
        if (currentUser) {
            html += `
                <div class="comment-input-area">
                    <input type="text" id="comment-input" placeholder="写下你的评论..." maxlength="500" />
                    <button onclick="submitComment()">发表</button>
                </div>
            `;
        } else {
            html += `<p style="color:#999; font-size:14px; margin-top:12px;"><a href="#" onclick="switchView('admin');return false;">登录</a> 后发表评论</p>`;
        }
        html += `</div>`;
        container.innerHTML = html;
    }

    async function submitComment() {
        if (!currentUser) { showToast('请先登录', 'error'); return; }
        const input = document.getElementById('comment-input');
        if (!input) return;
        const content = input.value.trim();
        if (!content) { showToast('评论不能为空', 'error'); return; }
        const postId = window._currentPostId;
        try {
            await apiFetch(`/posts/${postId}/comments`, {
                method: 'POST',
                body: JSON.stringify({ content })
            });
            showToast('评论发表成功', 'success');
            viewPost(postId);
        } catch(err) {
            showToast('评论失败: '+err.message, 'error');
        }
    }

    async function deleteComment(commentId) {
        if (!confirm('确定要删除这条评论吗？')) return;
        const postId = window._currentPostId;
        try {
            await apiFetch(`/posts/${postId}/comments/${commentId}`, { method: 'DELETE' });
            showToast('评论已删除', 'success');
            viewPost(postId);
        } catch(err) {
            showToast('删除失败: '+err.message, 'error');
        }
    }

    function goHome() { switchView('home'); }

    // ============================================================
    //  视图切换
    // ============================================================
    function switchView(view) {
        currentView = view;
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        if (view === 'home') {
            document.getElementById('view-home').classList.add('active');
            if (window._bootstrapPostsReady) {
                // 首屏已由 bootstrap 加载，避免重复请求；之后切回首页再刷新
                window._bootstrapPostsReady = false;
                renderPostList();
            } else {
                loadPosts();
            }
        } else if (view === 'detail') {
            document.getElementById('view-detail').classList.add('active');
        } else if (view === 'publish') {
            document.getElementById('view-publish').classList.add('active');
            if (!currentUser) {
                showToast('请先登录', 'error');
                switchView('admin');
            }
        } else if (view === 'admin') {
            document.getElementById('view-admin').classList.add('active');
            loadAdminPanel();
        }
        document.querySelectorAll('.nav-links a').forEach(a => a.style.opacity='0.7');
        document.querySelectorAll('.nav-links a').forEach(a => { if (a.dataset.view===view) a.style.opacity='1'; });
        window.scrollTo(0,0);
    }

    document.querySelectorAll('.nav-links a').forEach(a => {
        a.addEventListener('click', (e) => {
            e.preventDefault();
            const view = a.dataset.view;
            if (view === 'admin' && !currentUser) {
                switchView('admin');
            } else {
                switchView(view);
            }
        });
    });

    function insertImage() {
        if (!currentUser) { showToast('请先登录', 'error'); return; }
        document.getElementById('image-upload').click();
    }

    document.getElementById('image-upload').addEventListener('change', async function(e) {
        const file = this.files[0];
        if (!file) return;
        const formData = new FormData();
        formData.append('image', file);
        try {
            const res = await fetch(API_BASE+'/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                const textarea = document.getElementById('pub-content');
                const markdown = `![${file.name}](${data.url})`;
                const start = textarea.selectionStart;
                const end = textarea.selectionEnd;
                textarea.value = textarea.value.substring(0, start) + markdown + textarea.value.substring(end);
                textarea.focus();
                textarea.selectionStart = textarea.selectionEnd = start + markdown.length;
                showToast('图片已插入', 'success');
            } else {
                showToast('图片上传失败: ' + (data.error || '未知错误'), 'error');
            }
        } catch(err) {
            showToast('图片上传失败: ' + err.message, 'error');
        }
        this.value = '';
    });

        if (!avatar) { showToast('请先上传或输入图片URL', 'error'); return; }

            await apiFetch(`/users/${currentUser.username}/avatar`, {
                method: 'PUT',

            });

    // ============================================================
    //  发布文章（含链接复制）
    // ============================================================
    async function handlePublish() {
        if (!currentUser) { showToast('请先登录', 'error'); return; }
        const title = document.getElementById('pub-title').value.trim();
        const content = document.getElementById('pub-content').value.trim();
        const cover = document.getElementById('pub-cover-url').value.trim();
        if (!title || !content) {
            showToast('标题和内容不能为空', 'error');
            return;
        }
        try {
            const data = await apiFetch('/posts', {
                method: 'POST',
                body: JSON.stringify({ title, content, cover })
            });

            if (data.url) {
                showToast(`✅ 发布成功！链接已生成`, 'success');
                setTimeout(() => {
                    if (confirm(`文章已发布！\n访问链接：${data.url}\n点击"确定"复制链接到剪贴板`)) {
                        navigator.clipboard?.writeText(data.url);
                    }
                }, 500);
            } else {
                showToast('发布成功！', 'success');
            }

            document.getElementById('pub-title').value = '';
            document.getElementById('pub-content').value = '';
            document.getElementById('pub-cover-url').value = '';
            document.getElementById('cover-preview').style.display = 'none';
            clearDraft();
            if (currentView === 'home') loadPosts();
            switchView('home');
        } catch(err) {
            showToast('发布失败: '+err.message, 'error');
        }
    }

    // ============================================================
    //  管理后台
    // ============================================================
    async function loadAdminPanel() {
        try {
            const data = await apiFetch('/auth/status');
            if (data.isAdmin && data.user) {
                currentUser = data.user;
                document.getElementById('admin-login-box').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('admin-status').textContent = `✅ 已登录 (${currentUser.displayName || currentUser.username})`;
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
                if (currentUser.role === 'super_admin') {
                    document.querySelectorAll('.super-only').forEach(el => el.style.display = 'block');
                    try {
                        const cfg = await apiFetch('/config');
                        if (cfg.blogTitle) {
                            document.getElementById('blog-title-input').value = cfg.blogTitle;
                        }
                    } catch (e) {}
                } else {
                    document.querySelectorAll('.super-only').forEach(el => el.style.display = 'none');
                }
                document.getElementById('display-name-input').value = currentUser.displayName || currentUser.username;
                if (currentUser.avatar) {
                    document.getElementById('avatar-preview').src = currentUser.avatar;
                    document.getElementById('avatar-preview').style.display = 'block';
                    document.getElementById('avatar-url').value = currentUser.avatar;
                }
                await loadAdminPosts();
                if (currentUser.role === 'super_admin') loadUserList();
            } else {
                currentUser = null;
                document.getElementById('admin-login-box').style.display = 'block';
                document.getElementById('admin-panel').style.display = 'none';
                document.getElementById('admin-status').textContent = '🔒 请登录';
                document.getElementById('login-error').classList.remove('show');
            }
        } catch(err) {
            currentUser = null;
            document.getElementById('admin-login-box').style.display = 'block';
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('admin-status').textContent = '🔒 请登录';
        }
    }

                    </div>
                </div>

        const oldPwd = document.getElementById('old-pwd').value.trim();

    // ============================================================

    async function handleClearAllPosts() {
        if (!currentUser || currentUser.role !== 'super_admin') {
            showToast('权限不足', 'error');
            return;
        }
        if (!confirm('⚠️ 确定要删除所有文章吗？此操作不可恢复！')) return;
        if (!confirm('再次确认：清空所有文章？')) return;
        try {
            await apiFetch('/posts', { method: 'DELETE' });
            showToast('所有文章已清空', 'success');
            await loadAdminPosts();
            if (currentView === 'home') loadPosts();
        } catch(err) {
            showToast('清空失败: '+err.message, 'error');
        }
    }

    // ============================================================
    //  登录/登出
    // ============================================================
    async function handleLogin() {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value.trim();
        try {
            const data = await apiFetch('/auth/login', {
                method: 'POST',
                body: JSON.stringify({ username, password })
            });
            if (data.success && data.user) {
                currentUser = data.user;
                showToast('登录成功', 'success');
                loadAdminPanel();
                await loadConfig();
                if (currentView === 'detail' && window._currentPostId) {
                    viewPost(window._currentPostId);
                }
            } else {
                document.getElementById('login-error').textContent = '用户名或密码错误';
                document.getElementById('login-error').classList.add('show');
            }
        } catch(err) {
            showToast('登录失败: '+err.message, 'error');
        }
    }

    async function handleLogout() {
        try {
            await apiFetch('/auth/logout', { method: 'POST' });
            currentUser = null;
            showToast('已退出', 'info');
            loadAdminPanel();
            if (currentView === 'admin') switchView('admin');
            if (currentView === 'detail' && window._currentPostId) {
                viewPost(window._currentPostId);
            }
        } catch(err) {
            showToast('退出失败', 'error');
        }
    }

    // ============================================================
    //  快捷发布（管理后台）
    // ============================================================
    async function handleAddPost(e) {
        e.preventDefault();
        if (!currentUser) { showToast('请先登录', 'error'); return; }
        const title = document.getElementById('add-title').value.trim();
        const content = document.getElementById('add-content').value.trim();
        const cover = document.getElementById('add-cover').value.trim();
        if (!title || !content) { showToast('标题和内容不能为空', 'error'); return; }
        try {
            await apiFetch('/posts', {
                method: 'POST',
                body: JSON.stringify({ title, content, cover })
            });
            showToast('发布成功', 'success');
            document.getElementById('add-title').value = '';
            document.getElementById('add-content').value = '';
            document.getElementById('add-cover').value = '';
            await loadAdminPosts();
            if (currentView === 'home') loadPosts();
        } catch(err) {
            showToast('发布失败: '+err.message, 'error');
        }
    }

    async function handleDelete(id) {
        if (!confirm('确认删除该文章？')) return;
        try {
            await apiFetch(`/posts/${id}`, { method: 'DELETE' });
            showToast('已删除', 'success');
            await loadAdminPosts();
            if (currentView === 'home') loadPosts();
            if (currentView === 'detail') goHome();
        } catch(err) {
            showToast('删除失败: '+err.message, 'error');
        }
    }

    // 回车登录
    document.getElementById('login-password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('login-username').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleLogin();
    });

    // ============================================================
    //  初始化
    // ============================================================
    window.onload = async function() {
        showLoading();
        try {
            // 一次性获取：站点配置 + 文章列表 + 登录态（原来需要 3 次往返，现合并为 1 次）
            const data = await apiFetch('/bootstrap');

            // 应用站点配置
            if (data.config) {
                if (data.config.blogTitle) {
                    blogTitle = data.config.blogTitle;
                    document.title = blogTitle;
                    document.getElementById('site-title').textContent = blogTitle;
                    document.getElementById('home-title').textContent = blogTitle;
                }
                if (data.config.themeColor) {
                    themeColor = data.config.themeColor;
                    applyThemeColor(themeColor);
                    document.querySelector('#loading-screen .spinner')?.style.setProperty('border-top-color', themeColor);
                }
                if (data.config.wallpaper) {
                    document.body.style.backgroundImage = `url(${data.config.wallpaper})`;
                }
            }

            loadDraft();

            // 文章列表（已随 bootstrap 返回，无需再单独请求）
            posts = data.posts || [];
            window._bootstrapPostsReady = true;
            renderPostList();

            // 登录态
            if (data.auth && data.auth.isAdmin && data.auth.user) {
                currentUser = data.auth.user;
            }

            // 检测梯子路径 /p/文章ID（分享链接直达文章）
            const path = window.location.pathname;
            const match = path.match(/\/p\/([a-f0-9]+)/);
            if (match) {
                const postId = match[1];
                switchView('detail');
                await viewPost(postId);
                if (window.history && window.history.pushState) {
                    const cleanUrl = window.location.origin + window.location.pathname.replace(/\/p\/[a-f0-9]+/, '');
                    window.history.pushState({}, '', cleanUrl);
                }
                hideLoading();
                return;
            }

            switchView('home');
            hideLoading();
        } catch (err) {
            console.error('初始化失败:', err);
            showLoadingError(err.message || '加载失败，请刷新重试');
        }
    };

    // ============================================================
    //  暴露全局
    // ============================================================
    window.viewPost = viewPost;
    window.goHome = goHome;
    window.handleLogin = handleLogin;
    window.handleLogout = handleLogout;
    window.handleAddPost = handleAddPost;
    window.handleDelete = handleDelete;
    window.handleCreateUser = handleCreateUser;
    window.handleDeleteUser = handleDeleteUser;
    window.handleChangePassword = handleChangePassword;
    window.handleResetPassword = handleResetPassword;
    window.handleUpdateTitle = handleUpdateTitle;
    window.handleClearAllPosts = handleClearAllPosts;
    window.handleUpdateDisplayName = handleUpdateDisplayName;
    window.handleUpdateAvatar = handleUpdateAvatar;
    window.submitComment = submitComment;
    window.deleteComment = deleteComment;
    window.switchView = switchView;
    window.handlePublish = handlePublish;
    window.insertImage = insertImage;
    window.saveDraft = saveDraft;
</script>
</body>
</html>
